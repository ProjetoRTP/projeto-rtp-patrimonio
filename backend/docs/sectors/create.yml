tags:
  - Setores
summary: Cria um novo setor
security:
  - Bearer: []
consumes:
  - application/json
produces:
  - application/json
parameters:
  - in: body
    name: dados
    required: true
    schema:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
        descricao:
          type: string
responses:
  201:
    description: Setor criado com sucesso
  400:
    description: Erro de validação ou payload incorreto
  401:
    description: Token inválido
  403:
    description: Acesso negado
