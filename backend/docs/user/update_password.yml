tags: [Usuários]
summary: Atualiza a própria senha
security: [{Bearer: []}]
parameters:
  - in: path
    name: url_id
    type: integer
    required: true
  - in: body
    name: dados
    schema:
      type: object
      required: [senha_atual, nova_senha]
      properties:
        senha_atual: {type: string}
        nova_senha: {type: string}
responses:
  200: {description: Senha atualizada}
