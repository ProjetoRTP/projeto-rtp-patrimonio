tags: [Usuários]
summary: Reseta a senha com token recebido
parameters:
  - in: body
    name: dados
    schema:
      type: object
      required: [email, token, nova_senha]
      properties:
        email: {type: string}
        token: {type: string}
        nova_senha: {type: string}
responses:
  200: {description: Senha resetada}
