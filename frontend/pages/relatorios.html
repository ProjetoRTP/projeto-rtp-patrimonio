<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Relatórios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/relatorios.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">
        
        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="flex-grow-1 p-3 p-lg-5 position-relative" style="background-color: #EAF2F8; overflow-y: auto; overflow-x: hidden;">
            
            <div class="bg-white rounded-4 shadow-sm w-100 p-4 p-lg-5 mx-auto" style="max-width: 900px; z-index: 1;">
                
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
                    <h2 style="color: var(--azul-principal, #1D4587); font-weight: 700; margin: 0;">Relatórios</h2>
                    
                    <a onclick="gerarRelatorioGeral()" class="btn-cadastrar-custom w-100 w-sm-auto d-flex justify-content-center align-items-center" style="cursor: pointer;">
                        <i class="bi bi-clipboard-data me-2"></i> Relatório Geral
                    </a>
                </div>

                <div class="table-responsive w-100">
                    <table class="table tabela-padrao mb-0" style="min-width: 500px;">
                        <thead>
                            <tr>
                                <th>SETOR</th>
                                <th>DATA</th>
                                <th class="text-end">AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-subsetores">
                            <tr>
                                <td colspan="3" class="text-center py-4 text-muted">A carregar ...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
            
            <img src="../assets/imagens/logo.png" alt="Logo Coração" class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block" style="width: 60px; z-index: 0; opacity: 0.8;">
        </main>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/assets/js/relatórios.js"></script>
    <script src="../assets/js/navbar.js"></script>

</body>
</html>
