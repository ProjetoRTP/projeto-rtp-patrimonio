<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Cadastrar Subsetor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/cadastro-subsetor.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">

</head>

<body>
    <div class="d-flex vh-100">
        
        <nav id="sidebar" class="d-flex flex-column vh-100 pt-4" style="width: 250px; background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%));">
            <div class="text-center mb-4">
                <img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 60px;">
            </div>

            <div class="flex-grow-1">
                <a href="equipamentos.html" class="sidebar-link">Equipamentos</a>
                <a href="movimentacoes.html" class="sidebar-link">Movimentações</a>
                <a href="setores.html" class="sidebar-link">Setores</a>
                <a href="subsetores.html" class="sidebar-sublink active">Subsetores</a>
                <a href="relatorios.html" class="sidebar-link">Relatórios</a>
                <a href="usuarios.html" class="sidebar-link">Usuários</a>
                <a href="manutencao.html" class="sidebar-link">Manutenção</a>
            </div>

            <div class="mt-auto p-4 text-left">
                <a href="#" id="btn-sair" class="text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 500;">Sair</span>
                </a>
            </div>
        </nav>

        <main class="flex-grow-1 p-5 position-relative d-flex justify-content-center align-items-center" style="background-color: #EAF2F8; overflow-y: auto;">
            
            <div class="bg-white rounded-4 shadow-sm w-100 p-5" style="max-width: 650px; z-index: 1;">
                
                <h2 style="color: var(--azul-principal, #1D4587); font-weight: 700; margin-bottom: 30px;">Cadastro de Subsetor</h2>
                
                <form id="form-cadastro-subsetor">
                    
                    <div class="mb-4 d-flex align-items-center gap-2">
                        <label for="sel-setor-pai" class="form-label mb-0" style="font-size: 1.1rem;">Setor:</label>
                        <select class="form-select form-select-custom" id="sel-setor-pai" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="A carregar...">A carregar setores...</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="inp-nome-subsetor" class="form-label">Nome do Subsetor</label>
                        <input type="text" class="form-control form-control-custom w-100" id="inp-nome-subsetor" placeholder="Nome completo" required>
                    </div>

                    <div class="mb-5">
                        <label for="inp-descricao-subsetor" class="form-label">Descrição</label>
                        <input type="text" class="form-control form-control-custom w-100" id="inp-descricao-subsetor" placeholder="Digite uma breve descrição..." required>
                    </div>

                    <div class="d-flex justify-content-center gap-4">
                        <button type="button" id="btn-cancelar" class="btn btn-cancelar">Cancelar</button>
                        <button type="submit" id="btn-salvar-subsetor" class="btn btn-cadastrar">Cadastrar</button>
                    </div>

                </form>

            </div>
            
            <img src="../assets/imagens/logo.png" alt="Logo Coração" class="position-absolute bottom-0 end-0 mb-4 me-4" style="width: 60px; z-index: 0; opacity: 0.8;">
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/cadastro-subsetor.js"></script>
</body>
</html>
