<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Informações do Setor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/setores.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="flex-grow-1 p-3 p-lg-5 position-relative d-flex justify-content-center align-items-start"
            style="background-color: #EAF2F8; overflow-y: auto; overflow-x: hidden;">

            <div class="bg-white rounded-4 shadow-sm w-100 p-4 p-lg-5" style="max-width: 600px; z-index: 1;">

                <div class="d-flex align-items-center justify-content-between mb-4">
                    <h2 style="color: var(--azul-principal, #1D4587); font-weight: 700; margin: 0;">Informações do Setor</h2>
                    <button class="btn btn-secondary rounded-pill px-3" onclick="window.history.back()">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </button>
                </div>

                <div id="carregando" class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">A carregar...</span>
                    </div>
                    <p class="mt-3 text-muted">A carregar informações...</p>
                </div>

                <div id="conteudo" style="display: none;">
                    <div class="mb-4">
                        <label class="fw-bold mb-2" style="color: var(--azul-principal, #1D4587);">ID:</label>
                        <input disabled id="setor-id" type="text" class="form-control" readonly>
                    </div>

                    <div class="mb-4">
                        <label class="fw-bold mb-2" style="color: var(--azul-principal, #1D4587);">Nome:</label>
                        <input disabled id="setor-nome" type="text" class="form-control" readonly>
                    </div>

                    <div class="mb-4">
                        <label class="fw-bold mb-2" style="color: var(--azul-principal, #1D4587);">Descrição:</label>
                        <textarea disabled id="setor-descricao" class="form-control" rows="4" readonly></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="fw-bold mb-2" style="color: var(--azul-principal, #1D4587);">Status:</label>
                        <input disabled id="setor-status" type="text" class="form-control" readonly>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="cadastro-setor.html?id=" id="btn-editar" class="btn btn-outline-danger rounded-pill px-4">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                    </div>
                </div>

                <div id="erro" class="alert alert-danger" style="display: none;"></div>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração"
                class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block"
                style="width: 60px; z-index: 0; opacity: 0.8;">
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/setor-info.js"></script>
    <script src="../assets/js/navbar.js"></script>
</body>

</html>
