<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Movimentações-Info</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/equipamentos.css">
</head>

<body style="background-color: #E8F0F8; font-family: 'Quicksand', sans-serif;">
    <div class="d-flex vh-100">
        
        <!-- Navbar -->
        <nav id="sidebar" class="offcanvas-lg offcanvas-start d-flex flex-column h-100 pt-lg-4" tabindex="-1" style="width: 250px; background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); flex-shrink: 0;">

            <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm" style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 40px;"></a>
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i>
            </button>
            </header>
            
            <div class="d-lg-none text-end p-3 pb-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"></button>
            </div>

            <div class="text-center mb-4 d-none d-lg-block">
                <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 60px;"></a>
            </div>

            <div class="flex-grow-1 overflow-y-auto">
                <a href="../pages/computadores.html" class="sidebar-link">Equipamentos</a>
                <div class="collapse show" id="gavetaComputadores">
                    <a href="#" class="sidebar-sublink">Computadores</a>
                    <a href="#" class="sidebar-sublink">Impressoras</a>
                    <a href="#" class="sidebar-sublink">Estabilizadores</a>
                </div>
                <a href="movimentacoes.html" class="sidebar-link">Movimentações</a>
                <a href="setores.html" class="sidebar-link">Setores</a>
                <div class="collapse" id="gavetaSetores">
                    <a href="subsetores.html" class="sidebar-sublink">Subsetores</a>
                </div>
                <a href="relatorios.html" class="sidebar-link">Relatórios</a>
                <a href="usuario.html" class="sidebar-link">Usuários</a>
            </div>

            <div class="mt-auto p-4 text-left">
                <a href="../index.html" id="btn-sair" class="btn-sair text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 500;">Sair</span>
                </a>
            </div>
        </nav>

        <main class="flex-grow-1 d-flex justify-content-center align-items-center position-relative">
            
            <div class="bg-white p-5 rounded-4 shadow-sm" style="width: 100%; max-width: 650px; z-index: 1;">
                <h3 class="mb-4" style="color: #1D4587; font-weight: 700;">Movimentação</h3>

                <form>
                    <div class="row mb-3 align-items-center">
                        <label class="col-auto col-form-label fw-bold" style="color: #1D4587;">Equipamento:</label>
                        <div class="col">
                            <input type="text" class="form-control" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" placeholder="Computador 001" readonly>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label class="col-auto col-form-label fw-bold" style="color: #1D4587;">Colaborador:</label>
                        <div class="col">
                            <input type="text" class="form-control" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" placeholder="Leandro" readonly>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label class="col-auto col-form-label fw-bold" style="color: #1D4587;">Setor de origem:</label>
                        <div class="col">
                            <input type="text" class="form-control" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" placeholder="Administração" readonly>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label class="col-auto col-form-label fw-bold" style="color: #1D4587;">Setor de destino:</label>
                        <div class="col">
                            <input type="text" class="form-control" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" placeholder="Emergência" readonly>
                        </div>
                    </div>

                    <div class="mb-3 mt-4" style="width: 40%;">
                        <label class="form-label fw-bold" style="color: #1D4587;">Data de transferência</label>
                        <input type="text" class="form-control" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" placeholder="00.00.0000" readonly>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color: #1D4587;">Descrição</label>
                        <textarea class="form-control" rows="3" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" placeholder="Detalhes adicionais" readonly></textarea>
                    </div>

                    <div class="d-flex justify-content-center gap-4 mt-5">
                        <a href="movimentacoes-certa.html"><button type="button" class="btn fw-bold" style="background-color: #ffeaea; color: #bd4a4a; width: 140px; border: 1px solid #f0caca;">Voltar</button></a>
                    </div>
                </form>
            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração" class="position-absolute bottom-0 end-0 mb-4 me-4" style="width: 70px; z-index: 0; opacity: 0.9;">
            
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
