<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Editar usuário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/frontend/assets/css/style.css">

    <link rel="stylesheet" href="../assets/css/cadastro-subsetor.css">
    <link rel="stylesheet" href="../assets/css/cadastro-usuario.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/frontend/assets/css/usuario-editar.css">
</head>

<body class="fundo-tela">
    <div class="d-flex vh-100">
        
        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="d-flex align-items-center justify-content-center min-vh-100 position-relative w-100">
        
        <div class="card shadow border-0 p-5 rounded-4 bg-white" style="max-width: 800px; width: 100%;">
            
            <h2 class="fw-bold mb-4 texto-azul-escuro">Editar usuário</h2>

            <form>
                <div class="d-flex align-items-center mb-4">
                    
<select id="permissao" class="form-select input-personalizado" style="width: 200px;">
    <option value="Administrador">Administrador</option>
    <option value="Usuario">Usuário</option>
</select>
                </div>

                <div class="mb-4">
                    <label class="fw-bold mb-2 texto-azul-escuro">Nome do novo usuário:</label>
                    <input id="nome" type="text" class="form-control input-personalizado p-2" >
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="fw-bold mb-2 texto-azul-escuro">CPF</label>
                        <input id="cpf" type="text" class="form-control input-personalizado p-2" >
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label class="fw-bold mb-2 texto-azul-escuro">Data de Nascimento</label>
                        <input id="dataNascimento" type="date" class="form-control input-personalizado p-2">
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-md-6">
                        <label class="fw-bold mb-2 texto-azul-escuro">E-mail</label>
                        <input id="email" type="email" class="form-control input-personalizado p-2" >
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label class="fw-bold mb-2 texto-azul-escuro">Senha</label>
                        <input id="senha" type="password" class="form-control input-personalizado p-2" >
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-4 mt-2">
                    <button id="btCancelar" type="button" class="btn btn-cancelar px-5 py-2 rounded-3" onclick="window.location.href='usuario-info.html'">Cancelar</button>
                    <button id="btSalvar" class="btn btn-cadastrar px-5 py-2 rounded-3">Salvar</button>
                </div>
            </form>
        </div>

        <div class="position-absolute bottom-0 end-0 p-4">
            <img src="../assets/imagens/logo.png" alt="Logo do sistema" style="width: 60px;">
        </div>

    </main>
        

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/assets/js/usuario-editar.js "></script>
    <script src="../assets/js/navbar.js"></script>
    
</body>
</html>
