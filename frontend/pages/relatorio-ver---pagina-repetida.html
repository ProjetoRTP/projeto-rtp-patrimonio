<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Ver Relatório</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/relatorio-info.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="flex-grow-1 p-3 p-lg-5 position-relative"
            style="background-color: #EAF2F8; overflow-y: auto; overflow-x: hidden;">

            <div class="bg-white rounded-4 shadow-sm w-100 p-4 p-lg-5 mx-auto" style="max-width: 900px; z-index: 1;">

                <div
                    class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
                    <h2 style="color: var(--azul-principal, #1D4587); font-weight: 700; margin: 0;">Relatórios</h2>

                    <a onclick="gerarRelatorioGeral()" class="btn-cadastrar-custom">
                        <i class="bi bi bi-clipboard-data me-1"></i> Relatório Geral
                    </a>
                </div>

                <div class="bg-white rounded-4 shadow-sm w-100 p-4 p-lg-5 mx-auto" style="max-width: 1000px;">

                    <!-- TÍTULO -->
                    <h3 class="titulo-relatorio">Relatório Equipamentos</h3>

                    <!-- TOPO (SETOR + DATA + RESUMO) -->
                    <div class="row align-items-center mb-4">

                        <!-- ESQUERDA - Data e Setor -->
                        <div class="col-md-6">
                            <div class="mb-2" >
                                <strong>Data:</strong>
                                <span class="badge-info">02/02/2026</span>
                            </div>

                            <div >
                                <strong>Setor:</strong>
                                <span class="badge-info">Administração</span>
                            </div>
                        </div>

                        <!-- DIREITA (RESUMO) -->
                        <div class="col-md-6">
                            <div class="box-resumo">
                                <div>Total<br><span id="total">120</span></div>
                                <div>Em uso<br><span id="uso">80</span></div>
                                <div>Manut.<br><span id="manut">20</span></div>
                                <div>Estoque<br><span id="estoque">20</span></div>
                            </div>
                        </div>

                    </div>

                    <!-- LISTA -->
                    <h5 class="mb-3">Lista de equipamentos</h5>

                    <div class="table-responsive">
                        <table class="table tabela-padrao align-middle">
                            <thead>
                                <tr>
                                    <th>TOMB.</th>
                                    <th>TIPO</th>
                                    <th>MODELO</th>
                                    <th>PATRIMÔNIO</th>
                                    <th>STATUS</th>
                                    <th>ENTRADA</th>
                                    <th>ÚLTIMA MOV.</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-equipamentos">
                                <!-- JS preenche -->
                            </tbody>
                        </table>
                    </div>

                </div>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração"
                class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block"
                style="width: 60px; z-index: 0; opacity: 0.8;">
        </main>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/frontend/assets/js/relatorio-ver.js"></script>
    <script src="../assets/js/navbar.js"></script>

</body>

</html>
