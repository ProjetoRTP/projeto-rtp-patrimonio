<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Recuperar Senha</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    
    <main class="container-fluid p-0">
        <div class="row g-0">

            <section class="col-md-6 d-none d-md-block login-bg" aria-label="Fundo decorativo da instituição"></section>

            <section class="col-md-6 login-form-container" aria-labelledby="titulo-login">
                <div class="w-100 mx-auto" style="max-width: 400px;">
                    <h1 id="titulo-login" class="login-title text-center">Recuperar Senha</h1>
                        <div class="text-center mt-3">
                            <h2 class="form-label mb-4">
                                Para redefinir sua senha, informe o e-mail
                                <br/> cadastrado na sua conta e lhe enviaremos 
                                <br/> um TOKEN para redefinição.
                            </h2>
                        
                        </div>

                    <form id="form-recuperar-senha" action="/recuperar-senha" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" id="email" name="email" class="form-control " placeholder="Digite seu e-mail" required>
                        </div>

                        <button type="submit" class="btn btn-login">Enviar</button>
                    </form>

                    <footer id="rodape-login">
                        <img src="../assets/imagens/logo.png" alt="Logo PROCAPE" aria-hidden="true" id="logo-canto-inferior" >
                    </footer>
                </div>
            </section>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/recuperar-senha.js"></script>
</body>

</html>
