<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Criar Modelo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/equipamentos.css">
    <link rel="stylesheet" href="../assets/css/relatorios.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">
        <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm"
            style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo"
                    style="width: 40px;"></a>
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i> 
            </button>
        </header>

        <div id="espaco-da-navbar"></div>

        <main class="flex-grow-1 position-relative p-3 p-lg-5"
            style="background-color: #E6F4FB; overflow-y: auto; overflow-x: hidden;">

        <div class="bg-white p-4 p-lg-5 rounded-4 shadow-sm mx-auto" style="max-width: 900px; z-index: 1; position: relative;">

            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">

                <h2 style="color: #1D4587; font-weight: bold; margin: 0;">
                    Criar Modelo de Equipamento
                </h2>

                <a href="equipamentos-modelos.html"
                    class="btn btn-outline-primary rounded-pill px-4 py-2 d-flex align-items-center gap-2 fw-bold text-decoration-none">
                    <i class="bi bi-grid"></i>Ver Modelos
                </a>

            </div>

            <form>
                    <div class="row g-4 ">
                        <div class="col-md-6">
                            <label class="label-azul d-block fw-bold mb-1">Nome do Modelo de equipamento</label>
                            <input id="inp-nome" type="text" class="form-control input-vermelho w-100" placeholder="Ex: Roteador, Câmera de Segurança" required>
                        </div>

                        <div class="col-12 mt-4">
                            <label class="label-azul d-block fw-bold mb-1">Observações</label>
                            <textarea id="inp-descricao" class="form-control input-vermelho w-100" rows="3" placeholder="Digite os detalhes"></textarea>
                        </div>
                    </div>
                        
                    <!-- Nova Sessão de Campos Dinâmicos -->
                    <div class="col-12 mt-5">
                        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                            <h5 class="m-0" style="color: #1D4587; font-weight: bold;">
                                Campos Personalizados (Opcional)
                            </h5>

                            <button type="button" id="btn-add-campo" class="btn btn-sm text-white fw-bold" style="background-color: #214383; border-radius: 6px;">
                                <i class="bi bi-plus-circle me-1"></i> 
                                Adicionar Campo
                            </button>
                        </div>

                            <!-- BLOCO DE CAMPOS PADRÃO -->
                            <div class="mb-4 p-3 rounded-3" style="background-color: #f8f9fa; border: 1px dashed #c5d8f0;">
                                <p class="fw-bold mb-2" style="color: #1D4587; font-size: 0.88rem;">
                                    <i class="bi bi-info-circle me-1"></i> Campos já incluídos automaticamente em todos os equipamentos:
                                </p>
                                <div class="d-flex flex-wrap gap-2">
                                    <span class="badge rounded-pill px-3 py-2" style="background-color: #EAF2F8; color: #1D4587; font-size: 0.8rem;">Nº Patrimônio</span>
                                    <span class="badge rounded-pill px-3 py-2" style="background-color: #EAF2F8; color: #1D4587; font-size: 0.8rem;">Nome</span>
                                    <span class="badge rounded-pill px-3 py-2" style="background-color: #EAF2F8; color: #1D4587; font-size: 0.8rem;">Descrição</span>
                                    <span class="badge rounded-pill px-3 py-2" style="background-color: #EAF2F8; color: #1D4587; font-size: 0.8rem;">Status</span>
                                    <span class="badge rounded-pill px-3 py-2" style="background-color: #EAF2F8; color: #1D4587; font-size: 0.8rem;">Setor</span>
                                    <span class="badge rounded-pill px-3 py-2" style="background-color: #EAF2F8; color: #1D4587; font-size: 0.8rem;">Data de Aquisição</span>
                                </div>
                                <small class="text-muted mt-2 d-block">Adicione abaixo apenas campos extras específicos deste modelo.</small>
                            </div>
                            <!-- FIM BLOCO CAMPOS PADRÃO -->

                        <div id="container-campos" class="row g-3">
                            <!-- Campos adicionados via JS aparecerão aqui -->
                        </div>
                    </div>

                <!-- BOTÕES -->
                <div class="col-12 d-flex flex-column flex-sm-row justify-content-center gap-3 gap-sm-4 mt-5 mb-4">
                    <a id="btnCancelarLink" onclick="window.history.back()" class="text-decoration-none text-center">
                        <button type="button" class="btn text-white fw-bold w-100"
                            style="background-color: #bd4a4a; min-width: 140px; border-radius: 6px;">
                            Cancelar
                        </button>
                    </a>

                    <button id="btnSubmit" type="submit" class="btn text-white fw-bold"
                        style="background-color: #214383; min-width: 140px !important; border-radius: 6px;">
                        Criar Modelo
                    </button>
                </div>
        </form>
    </div>


    <img src="../assets/imagens/logo.png" alt="Logo Coração"
        class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block"
        style="width: 70px; z-index: 0; opacity: 0.9;">


        </main>

        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
   <script src="../assets/js/equipamento-generico.js?v=3"></script>
   
    <script src="../assets/js/navbar.js"></script>
</body>

</html>
