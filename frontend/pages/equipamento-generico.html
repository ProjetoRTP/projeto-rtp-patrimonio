<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Criar Tipo de Equipamentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/equipamentos.css">
    <link rel="stylesheet" href="../assets/css/relatorios.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">
        <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm"
            style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo"
                    style="width: 40px;"></a>
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i>
            </button>
        </header>

        <div id="espaco-da-navbar"></div>

        <main class="flex-grow-1 position-relative p-3 p-lg-5" style="background-color: #E6F4FB; overflow-y: auto; overflow-x: hidden;">

            <div class="bg-white p-4 p-lg-5 rounded-4 shadow-sm m-auto w-100"
                style="max-width: 900px; z-index: 1; position: relative;">

                <h2 class="text-center text-lg-start" style="color: #1D4587; font-weight: bold; margin-bottom: 40px;">
                    Criar Tipo de Equipamento</h2>

                <form>
                    <div class="row g-4">
                        <div class="row g-4">

                            <div class="col-md-6">
                                <label class="label-azul d-block">Nome do equipamento</label>
                                <input id="inp-nome" type="text" class="input-vermelho w-100" placeholder="Nome do tipo de equipamento">
                            </div>

                            <div class="col-12 mt-4">
                                <label class="label-azul d-block">Observações</label>
                                <textarea id="inp-descricao" class="input-vermelho w-100" rows="4" placeholder="Digite os detalhes"></textarea>
                            </div>

                        </div>
                    </div>

                    <!-- BOTÕES -->
                    <div class="col-12 d-flex flex-column flex-sm-row justify-content-center gap-3 gap-sm-4 mt-5 mb-4">
                        <a id="btnCancelarLink" href="equipamentos.html" class="text-decoration-none text-center">
                            <button type="button" class="btn text-white fw-bold w-100"
                                style="background-color: #bd4a4a; min-width: 140px; border-radius: 6px;">
                                Cancelar
                            </button>
                        </a>

                        <button id="btnSubmit" type="submit" class="btn text-white fw-bold"
                            style="background-color: #214383; min-width: 140px !important; border-radius: 6px;">
                            Criar Tipo
                        </button>
                    </div>
                </form>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração"
                class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block"
                style="width: 70px; z-index: 0; opacity: 0.9;">
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/equipamento-generico.js"></script>
    <script src="../assets/js/navbar.js"></script>
</body>

</html>
