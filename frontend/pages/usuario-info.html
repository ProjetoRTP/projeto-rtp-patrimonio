<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Visualizar usuário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/cadastro-usuario.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body style="background-color: #EAF2F8;">
    <div class="d-flex vh-100">
        <div id="espaco-da-navbar"></div>

        <main class="d-flex align-items-center justify-content-center w-100 p-3">
            <div class="card shadow border-0 p-4 p-md-5 rounded-4 bg-white" style="max-width: 700px; width: 100%;">
                <h2 class="fw-bold mb-4" style="color: #1D4587;">Visualizar usuário</h2>

                <form>
                    <div class="mb-4">
                        <label class="fw-bold mb-2">Nível de Acesso:</label>
                        <select id="permissao" class="form-select" disabled>
                            <option value="admin">Administrador</option>
                            <option value="gerente">Gerente</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="fw-bold mb-2">Nome:</label>
                        <input disabled id="nome" type="text" class="form-control">
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="fw-bold mb-2">CPF</label>
                            <input disabled id="cpf" type="text" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="fw-bold mb-2">Data de Nascimento</label>
                            <input disabled id="dataNascimento" type="date" class="form-control">
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="fw-bold mb-2">E-mail</label>
                        <input disabled id="email" type="email" class="form-control">
                    </div>

                    <div class="d-flex justify-content-center gap-3">
                        <button id="btn-voltar" type="button" class="btn btn-secondary px-5">Voltar</button>
                        <a id="btn-editar-link" href="#" class="btn btn-primary px-5" style="background-color: #1D4587;">Editar</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/usuario-info.js"></script>
    <script src="../assets/js/navbar.js"></script>
</body>
</html>
