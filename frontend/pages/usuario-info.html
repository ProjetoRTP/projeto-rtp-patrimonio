<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Subsetores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/usuario-info.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">
        
        <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm" style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 40px;"></a>
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i>
            </button>
        </header>

        <nav id="sidebar" class="offcanvas-lg offcanvas-start d-flex flex-column h-100 pt-lg-4" tabindex="-1" style="width: 250px; background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); flex-shrink: 0;">
            
            <div class="d-lg-none text-end p-3 pb-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"></button>
            </div>

            <div class="text-center mb-4 d-none d-lg-block">
                <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 60px;"></a>
            </div>

            <div class="flex-grow-1 overflow-y-auto">
                <a href="../pages/equipamentos-computadores.html" class="sidebar-link">Equipamentos</a>
                <a href="movimentacoes.html" class="sidebar-link">Movimentações</a>
                <a href="setores.html" class="sidebar-link">Setores</a>
                <a href="subsetores.html" class="sidebar-sublink active">Subsetores</a>
                <a href="relatorios.html" class="sidebar-link">Relatórios</a>
                <a href="usuarios.html" class="sidebar-link">Usuários</a>
            </div>

            <div class="mt-auto p-4 text-left">
                <a href="../index.html" id="btn-sair" class="text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 500;">Sair</span>
                </a>
            </div>
        </nav>

       <main class="flex-grow-1 p-3 p-lg-5 position-relative" style="background-color: #EAF2F8; overflow-y: auto; overflow-x: hidden;">
            
            <div class="bg-white rounded-4 shadow-sm w-100 p-4 p-lg-5 mx-auto" style="max-width: 900px; z-index: 1;">
                
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
                    <h2 style="color: var(--azul-principal, #1D4587); font-weight: 700; margin: 0;">Subsetores</h2>
                    
                    <a href="cadastro-subsetor.html" class="btn-cadastrar-custom">
                        <i class="bi bi-plus-circle me-1"></i> Cadastrar
                    </a>
                </div>

                <div class="container">
                <div class="container-box shadow">

                    <!-- Título -->
                    <h2 class="titulo">Usuário</h2>

                    <!-- Permissão -->
                    <div class="mb-4 d-flex align-items-center gap-3">
                    <label class="mb-0">Permissão:</label>
                    <span class="badge-permissao">Administrador</span>
                    </div>

                    <!-- Nome -->
                    <div class="mb-3">
                    <label>Nome do usuário</label>
                    <input type="text" class="form-control" value="Maria" disabled >
                    </div>

                    <!-- Linha CPF + Data -->
                    <div class="row mb-3">
                    <div class="col-md-6">
                        <label>CPF</label>
                        <input type="text" class="form-control" value="123.123.123-00" disabled>
                    </div>

                    <div class="col-md-6">
                        <label>Data de Nascimento</label>
                        <input type="text" class="form-control" value="01/01/1900" disabled>
                    </div>
                    </div>

                    <!-- Linha Email + Senha -->
                    <div class="row mb-4">
                    <div class="col-md-6">
                        <label>E-mail</label>
                        <input type="email" class="form-control" value="email@email.com" disabled>
                    </div>

                    <div class="col-md-6">
                        <label>Senha</label>
                        <input type="password" class="form-control" value="12345678" disabled>
                    </div>
                    </div>

                    <!-- Botões -->
                    <div class="d-flex justify-content-between">
                    <a href="#" class="btn btn-voltar">Voltar</a>
                    <a href="#" class="btn btn-editar">Editar</a>
                    </div>

                </div>

            </div>
            
            <img src="../assets/imagens/logo.png" alt="Logo Coração" class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block" style="width: 60px; z-index: 0; opacity: 0.8;">
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/usuario-ver"></script>
</body>
</html>
