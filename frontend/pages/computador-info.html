<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PROCAPE - Info Computador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>
<body style="background-color: #EAF2F8;">
    <div class="d-flex vh-100">
        <div id="espaco-da-navbar"></div>
        <main class="d-flex align-items-center justify-content-center w-100 p-3">
            <div class="card shadow border-0 p-5 rounded-4 bg-white" style="max-width: 800px; width: 100%;">
                <h2 class="fw-bold mb-4" style="color: #1D4587;">Informações do Equipamento</h2>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold">Tombamento:</label>
                        <input id="info-tombamento" type="text" class="form-control" disabled>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold">Nº de Série:</label>
                        <input id="info-serie" type="text" class="form-control" disabled>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold">Modelo:</label>
                        <input id="info-modelo" type="text" class="form-control" disabled>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold">Subsetor Atual:</label>
                        <input id="info-subsetor" type="text" class="form-control" disabled>
                    </div>
                </div>
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button onclick="window.location.href='computadores.html'" class="btn btn-secondary px-5">Voltar</button>
                    <a id="btn-editar-comp" href="#" class="btn btn-primary px-5" style="background-color: #1D4587;">Editar Dados</a>
                </div>
            </div>
        </main>
    </div>
    <script src="../assets/js/computador-info.js"></script>
    <script src="../assets/js/navbar.js"></script>
</body>
</html>
