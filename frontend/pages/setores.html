<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Setores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/setores.css">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">

        <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm"
            style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <img src="../assets/imagens/logo-branca.png" alt="Logo PROCAPE" style="width: 40px;">
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i>
            </button>
        </header>

        <nav id="sidebar" class="offcanvas-lg offcanvas-start d-flex flex-column h-100 pt-lg-4" tabindex="-1"
            style="width: 250px; background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); flex-shrink: 0;">

            <div class="d-lg-none text-end p-3 pb-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                    data-bs-target="#sidebar"></button>
            </div>

            <div class="text-center mb-4 d-none d-lg-block">
                <img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 60px;">
            </div>

            <div class="flex-grow-1 overflow-y-auto">
                <a href="equipamentos.html" class="sidebar-link">Equipamentos</a>
                <a href="movimentacoes.html" class="sidebar-link">Movimentações</a>
                <a href="setores.html" class="sidebar-link active">Setores</a>
                <a href="subsetores.html" class="sidebar-sublink">Subsetores</a>
                <a href="relatorios.html" class="sidebar-link">Relatórios</a>
                <a href="usuarios.html" class="sidebar-link">Usuários</a>
            </div>

            <div class="mt-auto p-4 text-left">
                <a href="#" id="btn-sair" class="text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 500;">Sair</span>
                </a>
            </div>
        </nav>

        <main class="flex-grow-1 p-3 p-lg-5 position-relative d-flex justify-content-center align-items-start"
            style="background-color: #EAF2F8; overflow-y: auto;">

            <div class="bg-white rounded-4 shadow-sm w-100 p-4 p-lg-5" style="max-width: 900px; z-index: 1;">

                <div
                    class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
                    <h2 style="color: var(--azul-principal, #1D4587); font-weight: 700; margin: 0;">Setores</h2>

                    <a href="cadastro-setor.html" class="btn-cadastrar-custom">
                        <i class="bi bi-plus-circle me-1"></i> Cadastrar
                    </a>
                </div>

                <form id="form-filtros"
                    class="barra-filtros d-flex flex-column flex-xl-row align-items-start align-items-xl-center justify-content-between mb-4 gap-3">

                    <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center gap-3 w-100">
                        <span class="d-none d-md-block fw-bold"
                            style="color: var(--azul-principal, #1D4587); font-size: 1rem;">FILTROS</span>

                        <div class="d-flex flex-column w-100">
                            <label class="filtro-label" for="filtro-setor">SETOR</label>
                            <select class="filtro-select w-100" id="filtro-setor">
                                <option value="">Selecione</option>
                            </select>
                        </div>

                        <div class="d-flex flex-column w-100">
                            <label class="filtro-label" for="filtro-subsetor">SUBSETOR</label>
                            <select class="filtro-select w-100" id="filtro-subsetor">
                                <option value="">Selecione</option>
                            </select>
                        </div>

                        <div class="d-flex flex-column w-100">
                            <label class="filtro-label" for="filtro-equipamento">EQUIPAMENTO</label>
                            <select class="filtro-select w-100" id="filtro-equipamento">
                                <option value="">Selecione</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2 w-100 justify-content-end justify-content-xl-start mt-2 mt-xl-0">
                        <button type="button" id="btn-limpar-filtros"
                            class="btn-limpar flex-grow-1 flex-xl-grow-0">LIMPAR</button>
                        <button type="submit" class="btn-aplicar flex-grow-1 flex-xl-grow-0">APLICAR</button>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table tabela-setores mb-0" style="min-width: 500px;">
                        <thead>
                            <tr>
                                <th>NOME DO SETOR</th>
                                <th class="text-end py-2">AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-setores">
                            <tr>
                                <td colspan="2" class="text-center py-4 text-muted fs-6">A carregar setores...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração"
                class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block"
                style="width: 60px; z-index: 0; opacity: 0.8;">
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/setores.js"></script>
</body>

</html>
