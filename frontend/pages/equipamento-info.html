<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Info Equipamento</title>

    <!-- Frameworks e Fontes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Seus arquivos CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body style="background-color: #EAF2F8;">
    <div class="d-flex min-vh-100">

        <!-- Sidebar container -->
        <div id="espaco-da-navbar"></div>

        <main class="d-flex justify-content-center align-items-center flex-grow-1 py-5 px-3"
            style="overflow-y: auto; max-height: 100vh;">

            <div class="card shadow-sm border-0 p-4 p-md-5 bg-white"
                style="max-width: 800px; width: 100%; border-radius: 12px;">

                <h2 class="fw-bold mb-4" style="color: #274D8A;">Equipamento</h2>

                <div class="row g-4">
                    <!-- Linha 1: Tipo e Setor -->
                    <div class="col-md-6">
                        <label class="fw-bold mb-1" style="color: #274D8A;">Tipo:</label>
                        <input id="info-tipo" type="text" class="form-control fw-medium" disabled 
                               style="background-color: #E8F0F8; border: 1px solid #A9C2D9; color: #555;">
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold mb-1" style="color: #274D8A;">Setor:</label>
                        <input id="info-setor" type="text" class="form-control fw-medium" disabled 
                               style="background-color: #E8F0F8; border: 1px solid #A9C2D9; color: #555;">
                    </div>

                    <!-- Linha 2: Tombamento e Data -->
                    <div class="col-md-6">
                        <label class="fw-bold mb-1" style="color: #274D8A;">Tombamento</label>
                        <input id="info-tombamento" type="text" class="form-control fw-medium" disabled 
                               style="background-color: #EAEAEA; border: 1px solid #CCCCCC; color: #555;">
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold mb-1" style="color: #274D8A;">Data de aquisição</label>
                        <input id="info-data-aquisicao" type="text" class="form-control fw-medium" disabled 
                               style="background-color: #EAEAEA; border: 1px solid #CCCCCC; color: #555;">
                    </div>

                    <!-- Linha 3: Valor -->
                    <div class="col-md-6">
                        <label class="fw-bold mb-1" style="color: #274D8A;">Valor</label>
                        <input id="info-valor" type="text" class="form-control fw-medium" disabled 
                               style="background-color: #EAEAEA; border: 1px solid #CCCCCC; color: #555;">
                    </div>

                    <!-- Linha 3: Valor -->
                    <div class="col-md-6">
                        <label class="fw-bold mb-1" style="color: #274D8A;">Setor</label>
                        <input id="info-setor" type="text" class="form-control fw-medium" disabled 
                               style="background-color: #EAEAEA; border: 1px solid #CCCCCC; color: #555;">
                    </div>

                    <!-- Linha 4: Observações -->
                    <div class="col-12">
                        <label class="fw-bold mb-1" style="color: #274D8A;">Observações</label>
                        <textarea id="info-observacao" class="form-control fw-medium" rows="4" disabled
                            style="background-color: #EAEAEA; border: 1px solid #CCCCCC; color: #555; resize: none;"></textarea>
                    </div>

                    <!-- Atributos Dinâmicos (visível apenas para genéricos) -->
                    <div id="container-atributos-info" class="row g-4 col-12 mt-0"></div>
                </div>

                <!-- Ações no final do Card -->
                <div class="d-flex justify-content-center gap-4 mt-5">
                    <button type="button" class="btn px-5 py-2"
                        style="background-color: #FFF0F0; color: #B33939; border: 1px solid #E5A8A8; font-weight: 600; border-radius: 8px;"
                        onclick="window.history.back()">
                        Voltar
                    </button>

                    <a id="btn-editar-equip" href="#" class="btn px-5 py-2"
                        style="background-color: #274D8A; color: white; font-weight: 600; border-radius: 8px; text-decoration: none; display: flex; align-items: center; justify-content: center;">
                        Editar
                    </a>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts do Sistema -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/equipamento-info.js"></script>
    <script src="../assets/js/navbar.js"></script>
</body>

</html>
