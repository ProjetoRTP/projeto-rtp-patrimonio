<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Equipamentos Computadores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/equipamentos.css">
    <link rel="stylesheet" href="../assets/css/relatorios.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">
        <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm"
            style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo"
                    style="width: 40px;"></a>
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i>
            </button>
        </header>

        <div id="espaco-da-navbar"></div>

        <main class="flex-grow-1 position-relative p-3 p-lg-5"
            style="background-color: #E6F4FB; overflow-y: auto; overflow-x: hidden;">

            <div class="bg-white p-4 p-lg-5 rounded-4 shadow-sm mx-auto" style="max-width: 900px; z-index: 1; position: relative;">

                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
                    
                    <h2 style="color: #1D4587; font-weight: bold; margin: 0;">Computadores</h2>

                   <a href="cadastro-equipamentos.html" class="btn btn-outline-danger rounded-pill px-4 py-2 d-flex align-items-center gap-2 fw-bold text-decoration-none">
                        <i class="bi bi-plus-circle"></i> Cadastrar
                    </a>
                </div>
    <!-- FILTRO -->
                <div class="border p-3 p-lg-2 px-lg-4 mb-4 d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3"
                    style="border-color: #1D4587 !important; border-radius: 30px !important;">

                    <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 gap-lg-4 w-100 w-lg-auto">
                        <span class="fw-bold text-center text-lg-start" style="color: #1D4587;">FILTROS</span>

                        <div class="d-flex flex-column flex-sm-row gap-3">
                            <div class="d-flex align-items-center gap-2">
                                <span style="color: #D32F2F; font-size: 0.85rem; font-weight: bold;">SETOR</span>
                                <select id="filtro-setor" class="form-select form-select-sm rounded-pill text-danger w-100 w-sm-auto"
                                    style="border-color: #ffcccc; font-size: 0.8rem; min-width: 120px;">
                                    <option value="">Selecione</option>
                                    <option value="rh">RH</option>
                                    <option value="salatreinamento">Sala Treinamento</option>
                                </select>
                            </div>

                            <div class="d-flex align-items-center gap-2">
                                <span style="color: #D32F2F; font-size: 0.85rem; font-weight: bold;">STATUS</span>
                                <select id="filtro-status" class="form-select form-select-sm rounded-pill text-danger w-100 w-sm-auto"
                                    style="border-color: #ffcccc; font-size: 0.8rem; min-width: 120px;">
                                    <option value="">Selecione</option>
                                    <option value="ativo">Ativo</option>
                                    <option value="manutencao">Manutenção</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 w-100 w-lg-auto justify-content-end mt-2 mt-lg-0">
                        <button id="btn-limpar"
                            class="btn btn-sm btn-outline-primary rounded-pill px-3 flex-grow-1 flex-lg-grow-0"
                            style="font-weight: bold; border-color: #1D4587; color: #1D4587; font-size: 0.8rem;">LIMPAR</button>
                        <button id="btn-aplicar"
                            class="btn btn-sm btn-primary rounded-pill px-3 flex-grow-1 flex-lg-grow-0"
                            style="font-weight: bold; background-color: #1D4587; border: none; font-size: 0.8rem;">APLICAR</button>
                    </div>
                </div>

                <div class="table-responsive w-100">
                    <table class="table table-borderless align-middle" style="min-width: 500px;">
                        <thead>
                            <tr style="border-bottom: 2px solid #f1f1f1;">
                                <th scope="col" style="color: #D32F2F; font-size: 0.85rem; font-weight: bold;" class="pb-3">
                                    NOME EQUIPAMENTO
                                </th>
                                <th scope="col" class="text-end pb-3" style="color: #D32F2F; font-size: 0.85rem; font-weight: bold;">
                                    AÇÕES
                                </th>
                            </tr>
                        </thead>

                        <tbody id="tbody-equipamentos">
                            <tr>
                                <td colspan="2" class="text-center text-muted py-4">
                                    Carregando computadores...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração"
                class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block"
                style="width: 70px; z-index: 0; opacity: 0.9;">

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/computadores.js"></script>
    <script src="../assets/js/navbar.js"></script>
</body>

</html>
