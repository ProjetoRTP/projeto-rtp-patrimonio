<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <title>PROCAPE - Info Subsetor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../navbar/navbar.css?v=4">
</head>
<body style="background-color: #EAF2F8; overflow: auto; scroll-behavior: smooth;">
    <div class="d-flex vh-100">
        <div id="espaco-da-navbar"></div>
        <main class="d-flex align-items-center justify-content-center w-100 p-3">
            <div class="card shadow border-0 p-5 rounded-4 bg-white" style="max-width: 600px; width: 100%;">
                <h2 class="fw-bold mb-4" style="color: #1D4587;">Informações do Subsetor</h2>
                <div class="mb-3">
                    <label class="fw-bold">Setor:</label>
                    <input id="info-setor-pai" type="text" class="form-control" disabled="">
                </div>
                <div class="mb-3">
                    <label class="fw-bold">Nome do Subsetor:</label>
                    <input id="info-nome" type="text" class="form-control" disabled="">
                </div>
                <div class="mb-4">
                    <label class="fw-bold">Descrição:</label>
                    <textarea id="info-descricao" class="form-control" rows="3" disabled=""></textarea>
                </div>
                <div class="d-flex justify-content-center gap-3">
                    <button onclick="window.location.href='subsetores.html'" class="btn btn-secondary px-5">Voltar</button>
                    <a id="btn-editar-subsetor" href="#" class="btn btn-primary px-5" style="background-color: #1D4587;">Editar</a>
                </div>
            </div>
        </main>
    </div>
    <script src="./subsetor-info.js"></script>
    <script src="../navbar/navbar.js"></script>

</body></html>
