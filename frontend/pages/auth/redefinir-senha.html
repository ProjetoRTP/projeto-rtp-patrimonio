<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Redefinir Senha</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">

    <style>
        /* Ajuste fino para o olho não ficar vermelho se o input for inválido */
        .input-group-text {
            background-color: white;
            border: 2px solid #1D4587;
            border-left: none;
            color: #1D4587;
            cursor: pointer;
        }
        .form-control.senha-input {
            border-right: none;
        }
    </style>
    <link rel="stylesheet" href="../navbar/navbar.css?v=4">
</head>

<body>
    <main class="container-fluid p-0 login-main">
        <div class="row g-0">
            <section class="col-md-6 d-none d-md-block login-bg" aria-label="Fundo decorativo da instituição">
                <div class="titulo-capa">
                    <h2 style="color:#ffffff;">Sistema de Gestão<br>de Equipamentos e Produtos</h2>
                    <p>Controle patrimonial e administrativo</p>
                </div>
            </section>

            <section class="col-md-6 login-form-container position-relative">
                <div class="w-100 mx-auto" style="max-width: 400px;">
                    <h1 class="login-title text-center">Redefinir Senha</h1>

                    <form id="form-redefinir-senha">
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" id="email" class="form-control" style="border: 2px solid #1D4587;" placeholder="Digite o seu e-mail" required="">
                        </div>
                        
                        <div class="mb-3">
                            <label for="token" class="form-label">Token</label>
                            <input type="text" id="token" class="form-control" style="border: 2px solid #1D4587;" placeholder="Digite o token recebido" required="">
                        </div>

                        <div class="mb-2">
                            <label for="nova-senha" class="form-label">Nova Senha</label>
                            <div class="input-group">
                                <input type="password" id="nova-senha" class="form-control senha-input" style="border: 2px solid #1D4587; border-right: none;" placeholder="Mínimo 8 caracteres" required="">
                                <span class="input-group-text toggle-password" data-target="nova-senha">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                            
                            <div class="progress mt-2" style="height: 6px; border-radius: 10px; background-color: #EAEAEA;">
                                <div id="barra-forca-senha" class="progress-bar" role="progressbar" style="width: 0%; transition: width 0.3s ease;"></div>
                            </div>
                            <small id="texto-forca-senha" class="d-block mb-3 fw-bold" style="font-size: 0.75rem; color: #555;"></small>
                        </div>

                        <div class="mb-4">
                            <label for="confirmar-senha" class="form-label">Confirmar Senha</label>
                            <div class="input-group">
                                <input type="password" id="confirmar-senha" class="form-control senha-input" style="border: 2px solid #1D4587; border-right: none;" placeholder="Repita a senha" required="">
                                <span class="input-group-text toggle-password" data-target="confirmar-senha">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                            <small id="texto-match-senha" class="d-block mt-1 fw-bold" style="font-size: 0.75rem; min-height: 15px;"></small>
                        </div>

                        <button type="submit" class="btn btn-login" style="background-color: #1D4587; color: white; border: none;">
                            Redefinir Senha
                        </button>
                    </form>
                </div>

                <img src="../../assets/imagens/logo.png" alt="Logo PROCAPE" id="logo-canto-inferior">

            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./redefinir-senha.js"></script>


</body></html>
