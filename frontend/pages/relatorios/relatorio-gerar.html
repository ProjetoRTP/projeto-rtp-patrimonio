<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Gerar Relatório</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../usuarios/cadastro-usuario.css">
    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../navbar/navbar.css?v=4">
</head>

<body class="fundo-tela">
    
    <div class="d-flex vh-100">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="d-flex align-items-center justify-content-center min-vh-100 position-relative w-100">

            <div class="card shadow border-0 p-5 rounded-4 bg-white" style="max-width: 800px; width: 100%;">

                <h2 class="fw-bold mb-4 texto-azul-escuro">Gerar Relatório</h2>

                <form id="form-relatorio">

                    <!-- TIPO DE RELATÓRIO -->
                    <div class="mb-4">
                        <label class="fw-bold mb-2 texto-azul-escuro">Tipo de Relatório</label>
                        <select id="tipo-relatorio" class="form-select input-personalizado" required="">
                            <option value="">Selecione</option>
                            <option value="geral">Geral</option>
                            <option value="movimentacoes">Movimentações</option>
                            <option value="manutencoes">Manutenções</option>
                            <option value="equipamentos">Equipamentos</option>
                            <option value="genericos">Equipamentos Genéricos</option>
                        </select>
                    </div>

                    <!-- PERÍODO -->
                    <div class="mb-4">
                        <label class="fw-bold mb-2 texto-azul-escuro">Período</label>
                        <select id="periodo" class="form-select input-personalizado" required="">
                            <option value="">Selecione</option>
                            <option value="hoje">Hoje</option>
                            <option value="semana">Esta semana</option>
                            <option value="mes">Este mês</option>
                            <option value="personalizado">Personalizado</option>
                        </select>
                    </div>

                    <!-- DATAS PERSONALIZADAS (oculto por padrão) -->
                    <div id="campos-data-personalizada" class="d-none">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="fw-bold mb-2 texto-azul-escuro">Data Início</label>
                                <input id="data-inicio" type="date" class="form-control input-personalizado p-2">
                            </div>
                            <div class="col-md-6 mt-3 mt-md-0">
                                <label class="fw-bold mb-2 texto-azul-escuro">Data Fim</label>
                                <input id="data-fim" type="date" class="form-control input-personalizado p-2">
                            </div>
                        </div>
                    </div>

                    <!-- FILTROS OPCIONAIS -->
                    <div class="row mb-5">
                        <div class="col-md-6">
                            <label class="fw-bold mb-2 texto-azul-escuro">Setor <span class="text-muted fw-normal" style="font-size: 0.85rem;">(opcional)</span></label>
                            <select id="filtro-setor" class="form-select input-personalizado">
                                <option value="">Todos os setores</option>
                            </select>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label class="fw-bold mb-2 texto-azul-escuro">Equipamento <span class="text-muted fw-normal" style="font-size: 0.85rem;">(opcional)</span></label>
                            <input id="filtro-equipamento" type="text" class="form-control input-personalizado p-2" placeholder="Nº patrimônio...">
                        </div>
                    </div>

                    <div class="d-flex justify-content-center gap-4 mt-2">
                        <button id="btCancelar" type="button" class="btn btn-cancelar px-5 py-2 rounded-3">Cancelar</button>
                        <button id="btGerar" type="submit" class="btn btn-cadastrar px-5 py-2 rounded-3">
                            <i class="bi bi-clipboard-data me-2"></i>Gerar
                        </button>
                    </div>

                </form>
            </div>

            <div class="position-absolute bottom-0 end-0 p-4">
                <img src="../../assets/imagens/logo.png" alt="Logo do sistema" style="width: 60px;">
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./relatorio-gerar.js"></script>
    <script src="../navbar/navbar.js"></script>


</body></html>
