<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Usuários</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/equipamentos.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="flex-grow-1 position-relative p-3 p-lg-5"
            style="background-color: #E6F4FB; overflow-y: auto; overflow-x: hidden;">

            <div class="bg-white p-4 p-lg-5 rounded-4 shadow-sm mx-auto"
                style="max-width: 900px; z-index: 1; position: relative;">

                <div
                    class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-5 gap-3">
                    <h2 style="color: #1D4587; font-weight: bold; margin: 0;">USUÁRIOS</h2>

                    <a href="cadastro-usuario.html"
                        class="btn btn-outline-danger rounded-pill px-4 py-2 d-flex justify-content-center align-items-center gap-2 fw-bold text-decoration-none w-100 w-sm-auto">
                        <i class="bi bi-plus-circle"></i> Cadastrar
                    </a>
                </div>

                <div class="table-responsive w-100">
                    <table class="table table-borderless align-middle w-100">

                        <thead>
                            <tr style="border-bottom: 2px solid #f1f1f1;">
                                <th scope="col" style="color: #D32F2F; font-size: 0.85rem; font-weight: bold;"
                                    class="pb-3">NOME USUÁRIO</th>
                                <th scope="col" class="text-end pb-3"
                                    style="color: #D32F2F; font-size: 0.85rem; font-weight: bold;">AÇÕES</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr style="border-bottom: 1px solid #f1f1f1;">
                                <td style="color: #1D4587; padding-top: 15px; padding-bottom: 15px;">
                                    <a href="#" data-bs-toggle="modal" data-bs-target="#modalHistorico"
                                        style="color: #1D4587; text-decoration: none; font-weight: 500;">Maria Maria
                                        Maria</a>
                                </td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <button class="btn btn-sm btn-outline-primary px-2 py-1">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button onclick="window.location.href='usuario-info.html'"
                                            class="btn btn-sm btn-outline-danger px-2 py-1">
                                            <i class="bi bi-info"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>

                            <tr style="border-bottom: 1px solid #f1f1f1;">
                                <td style="color: #1D4587; padding-top: 15px; padding-bottom: 15px;">
                                    <a href="#" data-bs-toggle="modal" data-bs-target="#modalHistorico"
                                        style="color: #1D4587; text-decoration: none; font-weight: 500;">Maria Maria
                                        Maria</a>
                                </td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <button class="btn btn-sm btn-outline-primary px-2 py-1">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button onclick="window.location.href='usuario-info.html'"
                                            class="btn btn-sm btn-outline-danger px-2 py-1">
                                            <i class="bi bi-info"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>

                            <tr style="border-bottom: 1px solid #f1f1f1;">
                                <td style="color: #1D4587; padding-top: 15px; padding-bottom: 15px;">
                                    <a href="#" data-bs-toggle="modal" data-bs-target="#modalHistorico"
                                        style="color: #1D4587; text-decoration: none; font-weight: 500;">Maria Maria
                                        Maria</a>
                                </td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <button class="btn btn-sm btn-outline-primary px-2 py-1">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <button onclick="window.location.href='usuario-info.html'"
                                            class="btn btn-sm btn-outline-danger px-2 py-1">
                                            <i class="bi bi-info"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração"
                class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block"
                style="width: 70px; z-index: 0; opacity: 0.9;">

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/movimentacoes.js"></script>
    <script src="../assets/js/navbar.js"></script>

</html>
