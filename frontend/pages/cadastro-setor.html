<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Cadastrar Setor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/cadastro-setor.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">

    
</head>

<body>
    <div class="d-flex vh-100">

        <!-- Navbar -->
        <nav id="sidebar" class="offcanvas-lg offcanvas-start d-flex flex-column h-100 pt-lg-4" tabindex="-1" style="width: 250px; background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); flex-shrink: 0;">

            <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm" style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 40px;"></a>
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i>
            </button>
            </header>
            
            <div class="d-lg-none text-end p-3 pb-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"></button>
            </div>

            <div class="text-center mb-4 d-none d-lg-block">
                <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 60px;"></a>
            </div>

            <div class="flex-grow-1 overflow-y-auto">
                <a href="../pages/computadores.html" class="sidebar-link">Equipamentos</a>
                <div class="collapse show" id="gavetaComputadores">
                    <a href="#" class="sidebar-sublink">Computadores</a>
                    <a href="#" class="sidebar-sublink">Impressoras</a>
                    <a href="#" class="sidebar-sublink">Estabilizadores</a>
                </div>
                <a href="movimentacoes.html" class="sidebar-link">Movimentações</a>
                <a href="setores.html" class="sidebar-link">Setores</a>
                <div class="collapse" id="gavetaSetores">
                    <a href="subsetores.html" class="sidebar-sublink">Subsetores</a>
                </div>
                <a href="relatorios.html" class="sidebar-link">Relatórios</a>
                <a href="usuario.html" class="sidebar-link">Usuários</a>
            </div>

            <div class="mt-auto p-4 text-left">
                <a href="../index.html" id="btn-sair" class="btn-sair text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 500;">Sair</span>
                </a>
            </div>
        </nav>

        <main class="flex-grow-1 p-5 position-relative d-flex justify-content-center align-items-center"
            style="background-color: #EAF2F8; overflow-y: auto;">

            <div class="bg-white rounded-4 shadow-sm w-100 p-5" style="max-width: 650px; z-index: 1;">

                <h2 style="color: var(--azul-principal, #1D4587); font-weight: 700; margin-bottom: 30px;">Cadastro de
                    Setor</h2>

                <form id="form-cadastro-setor">

                    <div class="mb-4">
                        <label for="inp-nome-setor" class="form-label">Nome do Setor</label>
                        <input type="text" class="form-control form-control-custom w-100" id="inp-nome-setor"
                            placeholder="Nome completo" required>
                    </div>

                    <div class="mb-5">
                        <label for="inp-descricao-setor" class="form-label">Descrição</label>
                        <input type="text" class="form-control form-control-custom w-100" id="inp-descricao-setor"
                            placeholder="Digite uma breve descrição..." required>
                    </div>

                    <div class="d-flex justify-content-center gap-3">
                        <button type="button" id="btn-cancelar" class="btn btn-cancelar">Cancelar</button>
                        <button type="submit" id="btn-salvar-setor" class="btn btn-cadastrar">Cadastrar</button>
                    </div>

                </form>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração" class="position-absolute bottom-0 end-0 mb-4 me-4"
                style="width: 60px; z-index: 0; opacity: 0.8;">
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/cadastro-setor.js"></script>
</body>

</html>
