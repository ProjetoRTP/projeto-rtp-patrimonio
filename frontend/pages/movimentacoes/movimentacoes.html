<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Movimentações</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../equipamentos/equipamentos.css">
    <link rel="stylesheet" href="../relatorios/relatorios.css">
    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="../navbar/navbar.css?v=4">
</head>

<body style="overflow: auto; scroll-behavior: smooth;">
    <div class="page-wrapper" >

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="flex-grow-1 position-relative p-3 p-lg-5" style="background-color: #E6F4FB; overflow-y: auto; overflow-x: hidden;">

            <div class="bg-white p-4 p-lg-5 rounded-4 shadow-sm mx-auto" style="max-width: 900px; z-index: 1; position: relative;">

                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
                    
                    <h2 style="color: #1D4587; font-weight: bold; margin: 0;">Movimentações</h2>

                    <a href="./transferir-mov.html" class="btn btn-outline-danger rounded-pill px-4 py-2 d-flex align-items-center gap-2 fw-bold text-decoration-none">
                        <i class="bi bi-plus-circle"></i> Transferência
                    </a>
                </div>
    <!-- FILTRO -->
                <div class="border p-3 p-lg-2 px-lg-4 mb-4 d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3" style="border-color: #1D4587 !important; border-radius: 30px !important;">

                    <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 gap-lg-4 w-100 w-lg-auto">
                        <span class="fw-bold text-center text-lg-start" style="color: #1D4587;">FILTROS</span>
                        
                        <div class="d-flex flex-column flex-sm-row gap-3">
                            <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center gap-2 w-100">
                                <span style="color: #D32F2F; font-size: 0.85rem; font-weight: bold;">SETOR</span>
                                <select id="filtro-setor" class="form-select form-select-sm rounded-pill text-danger w-100 w-sm-auto" style="border-color: #ffcccc; font-size: 0.8rem; min-width: 120px;">
                                    <option value="">Selecione</option>
                                    <option value="rh">RH</option>
                                    <option value="salatreinamento">Sala Treinamento</option>
                                </select>
                            </div>

                            <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center gap-2 w-100">
                                <span style="color: #D32F2F; font-size: 0.85rem; font-weight: bold;">EQUIPAMENTO</span>
                                <select id="filtro-equip" class="form-select form-select-sm rounded-pill text-danger w-100" style="border-color: #ffcccc; font-size: 0.8rem; min-width: 120px;">
                                    <option value="">Selecione</option>
                                    <option value="ativo">Ativo</option>
                                    <option value="emprestado">Emprestado</option>
                                    <option value="em_manutencao">Em Manutenção</option>
                                    <option value="inativo">Inativo</option>
                                    <option value="descartado">Descartado</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 w-100 justify-content-end mt-2 mt-lg-0">
                        <button id="btn-limpar" class="btn btn-sm btn-outline-primary rounded-pill px-3 flex-grow-1 flex-lg-grow-0" style="font-weight: bold; border-color: #1D4587; color: #1D4587; font-size: 0.8rem;">LIMPAR</button>
                        <button id="btn-aplicar" class="btn btn-sm btn-primary rounded-pill px-3 flex-grow-1 flex-lg-grow-0" style="font-weight: bold; background-color: #1D4587; border: none; font-size: 0.8rem;">APLICAR</button>
                    </div>
                </div>

                <div class="table-responsive w-100">
                    <table class="table table-borderless align-middle" style="min-width: 500px;">

                        <thead>
                            <tr style="border-bottom: 2px solid #f1f1f1;">
                                <th scope="col" style="color: #D32F2F; font-size: 0.85rem; font-weight: bold;" class="pb-3">ID</th>

                                <th scope="col" style="color: #D32F2F; font-size: 0.85rem; font-weight: bold; text-align: center;" class="pb-3">EQUIPAMENTOS</th>
                                
                                <th scope="col" class="text-end pb-3" style="color: #D32F2F; font-size: 0.85rem; font-weight: bold;">DETALHAR</th>
                            </tr>
                        </thead>

                        <tbody id="tabela-manutencoes">
                        <!-- Dados virão do JS -->
                        </tbody>
                    </table>
                </div>

            </div>

            <img src="../../assets/imagens/logo.png" alt="Logo Coração" class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block" style="width: 70px; z-index: 0; opacity: 0.9;">

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./movimentacoes.js"></script>
    <script src="../navbar/navbar.js"></script>


</body></html>
