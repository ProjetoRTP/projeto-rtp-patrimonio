<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Movimentações - Info</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../equipamentos/equipamentos.css">
    <link rel="stylesheet" href="../usuarios/cadastro-usuario.css">
    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../navbar/navbar.css?v=4">
</head>

<body style="background-color: #E8F0F8; font-family: 'Quicksand', sans-serif;">
    <div class="d-flex vh-100">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="d-flex align-items-center justify-content-center min-vh-100 position-relative w-100">

            <!-- Carregando -->
            <div id="carregando" class="text-center text-muted py-5">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p>Carregando movimentação...</p>
            </div>

            <!-- Erro -->
            <div id="erro" class="alert alert-danger mx-auto d-none" style="max-width: 600px;"></div>

            <!-- Conteúdo -->
            <div id="conteudo" class="d-none" style="width: 100%">
                <div class="card shadow border-0 p-5 rounded-4 bg-white mx-auto" style="max-width: 800px;">

                    <h2 class="fw-bold mb-4 texto-azul-escuro">Visualizar Movimentação</h2>

                    <form id="formMovimentacao">

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="fw-bold mb-2 texto-azul-escuro">ID da movimentação</label>
                                <input disabled="" id="movimentacao-id" type="text" class="form-control input-personalizado p-2">
                            </div>
                            <div class="col-md-6 mt-3 mt-md-0">
                                <label class="fw-bold mb-2 texto-azul-escuro">Data de transferência</label>
                                <input disabled="" id="dataTransferencia" type="date" class="form-control input-personalizado p-2">
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="fw-bold mb-2 texto-azul-escuro">Equipamento</label>
                                <input disabled="" id="equipamento" type="text" class="form-control input-personalizado p-2">
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="fw-bold mb-2 texto-azul-escuro">Setor de origem</label>
                                <input disabled="" id="setorOrigem" type="text" class="form-control input-personalizado p-2">
                            </div>
                            <div class="col-md-6 mt-3 mt-md-0">
                                <label class="fw-bold mb-2 texto-azul-escuro">Setor de destino</label>
                                <input disabled="" id="setorDestino" type="text" class="form-control input-personalizado p-2">
                            </div>
                        </div>

                        <div class="row mb-4">
                            <!-- <div class="col-12">
                                <label class="fw-bold mb-2 texto-azul-escuro">Observação</label>
                                <textarea disabled id="observacao" rows="3" class="form-control input-personalizado p-2"></textarea>
                            </div> -->
                        </div>

                        <div class="d-flex justify-content-center gap-4 mt-2">
                            <button id="btCancelar" type="button" class="btn btn-cancelar px-5 py-2 rounded-3" onclick="window.location.href='movimentacoes.html'">Voltar</button>
                        </div>

                    </form>
                </div>
            </div>

            <div class="position-absolute bottom-0 end-0 p-4">
                <img src="../../assets/imagens/logo.png" alt="Logo do sistema" style="width: 60px;">
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../navbar/navbar.js"></script>
    <script src="./movimentacoes_info.js"></script>


</body></html>
