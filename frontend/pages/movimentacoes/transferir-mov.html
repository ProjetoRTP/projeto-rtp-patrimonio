<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Nova Movimentação</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
 
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../equipamentos/equipamentos.css">
    <link rel="stylesheet" href="../usuarios/cadastro-usuario.css">
    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../navbar/navbar.css?v=4">
</head>
 
<body style="background-color: #E8F0F8; font-family: 'Quicksand', sans-serif; overflow: auto; scroll-behavior: smooth;">
    <div class="page-wrapper">
        <!-- navbar mobile -->
        <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm" style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <a href="../dashboard/menu_principal.html"><img src="../../assets/imagens/logo-branca.png" alt="Logo" style="width: 40px;"></a>
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i>
            </button>
        </header>
 
        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>
 
        <main class="d-flex align-items-center justify-content-center min-vh-100 position-relative w-100">
 
            <div class="card shadow border-0 p-5 rounded-4 bg-white" style="max-width: 800px; width: 100%;">
 
                <h2 class="fw-bold mb-4 texto-azul-escuro">Nova Movimentação</h2>
 
                <form id="formMovimentacao">
 
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="fw-bold mb-2 texto-azul-escuro">Data de transferência</label>
                            <input id="dataTransferencia" type="date" class="form-control input-personalizado p-2">
                        </div>
 
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label class="fw-bold mb-2 texto-azul-escuro">
                                <i class="bi bi-upc-scan me-1"></i> Código de Barras
                            </label>
                            <!-- Leitor físico digita o código e envia Enter automaticamente -->
                            <input id="equipamento" class="form-control input-personalizado p-2" placeholder="Aponte o leitor para o código..." autocomplete="off">
                            <small id="equip-feedback" class="mt-1 d-block"></small>
                        </div>
                    </div>
 
                    <div class="row mb-5">
                        <div class="col-md-6">
                            <label class="fw-bold mb-2 texto-azul-escuro">Setor de origem</label>
                            <input id="setorOrigem" list="lista-setores-origem" class="form-control input-personalizado p-2" placeholder="Preenchido automaticamente..." autocomplete="off">
                            <datalist id="lista-setores-origem"></datalist>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label class="fw-bold mb-2 texto-azul-escuro">Setor de destino</label>
                            <input id="setorDestino" list="lista-setores-destino" class="form-control input-personalizado p-2" placeholder="Digite ou selecione..." autocomplete="off">
                            <datalist id="lista-setores-destino"></datalist>
                        </div>
                    </div>
 
                    <div class="d-flex justify-content-center gap-4 mt-3">
                        <button id="btCancelar" type="button" class="btn btn-cancelar px-5 py-2 rounded-3">Cancelar</button>
                        <button id="btCriar" type="submit" class="btn btn-cadastrar px-5 py-2 rounded-3">Transferir</button>
                    </div>
                </form>
            </div>
 
            <div class="position-absolute bottom-0 end-0 p-4">
                <img src="../../assets/imagens/logo.png" alt="Logo do sistema" style="width: 60px;">
            </div>
 
        </main>
    </div>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./transferir-mov.js"></script>
    <script src="../navbar/navbar.js"></script>
 
 
</body></html>
