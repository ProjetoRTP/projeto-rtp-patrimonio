<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Menu Principal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../assets/css/equipamentos.css">
</head>

<body style="background-color: #E8F0F8; font-family: 'Quicksand', sans-serif;">
    <div class="d-flex vh-100">
        
        <!-- Navbar -->
        <nav id="sidebar" class="d-flex flex-column vh-100 position-relative" style="width: 250px; background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 2;">
            
            <div class="text-center mt-4 mb-4">
                <img src="../assets/imagens/logo-branca.png" alt="Logo PROCAPE" style="width: 70px;">
            </div>

            <ul class="nav flex-column w-100 px-4">
                <li class="nav-item linha-divisoria">
                    <a class="nav-link text-white fw-bold px-0" href="#">Equipamentos</a>
                    <ul class="nav flex-column ms-3 mt-2">
                        <li class="nav-item">
                            <a class="nav-link text-white px-0 py-1" style="font-size: 0.9rem;" href="#">Computadores</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50 px-0 py-1" style="font-size: 0.9rem;" href="#">Impressoras</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50 px-0 py-1" style="font-size: 0.9rem;" href="#">Estabilizadores</a>
                        </li>
                    </ul>
                </li>
                <li class="nav-item linha-divisoria">
                    <a class="nav-link text-white fw-bold px-0" href="movimentacoes.html">Movimentações</a>
                </li>
                <li class="nav-item linha-divisoria">
                    <a class="nav-link text-white fw-bold px-0" href="setores.html">Setores</a>
                </li>
                <li class="nav-item linha-divisoria">
                    <a class="nav-link text-white fw-bold px-0" href="#">Relatórios</a>
                </li>
                <li class="nav-item linha-divisoria">
                    <a class="nav-link text-white fw-bold px-0" href="#">Usuários</a>
                </li>
            </ul>

            <div class="mt-auto mb-5 ms-4">
                <a href="index.html" class="btn-sair text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 600; font-size: 1rem;">Sair</span>
                </a>
            </div>
        </nav>

        <main class="flex-grow-1 d-flex justify-content-center align-items-center position-relative">
            
            <div class="bg-white p-5 rounded-4 shadow-sm" style="width: 100%; max-width: 650px; z-index: 1;">
                <h3 class="mb-4" style="color: #1D4587; font-weight: 700;">Movimentação</h3>

                <form>
                    <div class="row mb-3 align-items-center">
                        <label class="col-auto col-form-label fw-bold" style="color: #1D4587;">Equipamento:</label>
                        <div class="col">
                            <input type="text" class="form-control" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" value="Computador 001" readonly>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label class="col-auto col-form-label fw-bold" style="color: #1D4587;">Colaborador:</label>
                        <div class="col">
                            <input type="text" class="form-control" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" value="Leandro" readonly>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label class="col-auto col-form-label fw-bold" style="color: #1D4587;">Setor de origem:</label>
                        <div class="col">
                            <input type="text" class="form-control" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" value="Administração" readonly>
                        </div>
                    </div>

                    <div class="row mb-3 align-items-center">
                        <label class="col-auto col-form-label fw-bold" style="color: #1D4587;">Setor de destino:</label>
                        <div class="col">
                            <input type="text" class="form-control" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" value="Emergência" readonly>
                        </div>
                    </div>

                    <div class="mb-3 mt-4" style="width: 40%;">
                        <label class="form-label fw-bold" style="color: #1D4587;">Data de transferência</label>
                        <input type="text" class="form-control" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" placeholder="00.00.0000" readonly>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold" style="color: #1D4587;">Descrição</label>
                        <textarea class="form-control" rows="3" style="background-color: #EBF1F9; border: 1px solid #B9CDE5; color: #1D4587;" placeholder="Detalhes adicionais" readonly></textarea>
                    </div>

                    <div class="d-flex justify-content-center gap-4 mt-5">
                        <button type="button" class="btn fw-bold" style="background-color: #ffeaea; color: #bd4a4a; width: 140px; border: 1px solid #f0caca;">Voltar</button>
                    </div>
                </form>
            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração" class="position-absolute bottom-0 end-0 mb-4 me-4" style="width: 70px; z-index: 0; opacity: 0.9;">
            
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
