<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Visualizar impressora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../frontend/assets/css/style.css">

    <!-- Biblioteca CSS -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../subsetores/cadastro-subsetor.css">
    <link rel="stylesheet" href="../usuarios/cadastro-usuario.css">
    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../usuarios/usuario-info.css">
    <link rel="stylesheet" href="../navbar/navbar.css?v=4">
</head>

<body class="fundo-tela">
    <div class="d-flex vh-100">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="d-flex align-items-center justify-content-center min-vh-100 position-relative w-100">

            <div class="card shadow border-0 p-5 rounded-4 bg-white" style="max-width: 800px; width: 100%;">

                <h2 class="fw-bold mb-4 texto-azul-escuro">Visualizar Impressora</h2>
                <form>
                    <div id="campos-impressora" class="row g-4 ">

                        <div class="col-md-6">
                            <label class="label-azul">Modelo</label>
                            <input disabled="" id="modelo" type="text" class="form-control input-vermelho">
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul">Tipo</label>
                            <select disabled="" id="tipo" class="form-select input-vermelho">
                                <option value="laser">Laser</option>
                                <option value="jato de tinta">Jato de tinta</option>
                                <option value="termica">Térmica</option>
                                <option value="plotter">Plotter</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul">Coloração</label>
                            <select disabled="" id="coloracao" class="form-select input-vermelho">
                                <option value="monocromatica">Monocromática</option>
                                <option value="colorida">Colorida</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul">Conectividade</label>
                            <input disabled="" id="conectividade" type="text" class="form-control input-vermelho">
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="label-azul">Endereço IP</label>
                            <input disabled="" id="ip" type="text" class="form-control input-vermelho">
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul">Insumo principal</label>
                            <input disabled="" id="insumo" type="text" class="form-control input-vermelho">
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul">Valor</label>
                            <input disabled="" id="info-valor" type="text" class="form-control input-vermelho">
                        </div>

                    </div>
                </form>

                <div class="d-flex justify-content-center gap-4 mt-2">
                    <button id="btCancelar" type="button" class="btn btn-cancelar px-5 py-2 rounded-3" onclick="window.history.back()">Voltar</button>
                    <a id="btnEditar" href="#" class="btn btn-cadastrar px-5 py-2 rounded-3">Editar</a>

                </div>


                <div class="position-absolute bottom-0 end-0 p-4">
                    <img src="../../assets/imagens/logo.png" alt="Logo do sistema" style="width: 60px;">
                </div>

        </div></main>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./impressora-info.js"></script>
    <script src="../navbar/navbar.js"></script>


</body></html>
