    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Cadastrar Subsetor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- NÃO MEXE NESSES CAMINHOS PELO AMOR DE DEUS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/cadastro-subsetor.css">
    <link rel="stylesheet" href="../assets/css/cadastro-usuario.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">

</head>

<body class="fundo-tela">
    <div class="d-flex vh-100">
        
        <nav id="sidebar" class="offcanvas-lg offcanvas-start d-flex flex-column h-100 pt-lg-4" tabindex="-1" style="width: 250px; background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); flex-shrink: 0;">

            <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm" style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 40px;"></a>
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i>
            </button>
            </header>
            
            <div class="d-lg-none text-end p-3 pb-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"></button>
            </div>

            <div class="text-center mb-4 d-none d-lg-block">
                <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 60px;"></a>
            </div>

            <div class="flex-grow-1 overflow-y-auto">
                <a href="../pages/computadores.html" class="sidebar-link">Equipamentos</a>
                <a href="movimentacoes.html" class="sidebar-link">Movimentações</a>
                <a href="setores.html" class="sidebar-link">Setores</a>
                <a href="subsetores.html" class="sidebar-sublink active">Subsetores</a>
                <a href="relatorios.html" class="sidebar-link">Relatórios</a>
                <a href="usuario.html" class="sidebar-link">Usuários</a>
            </div>

            <div class="mt-auto p-4 text-left">
                <a href="../index.html" id="btn-sair" class="btn-sair text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 500;">Sair</span>
                </a>
            </div>
        </nav>

        <main class="d-flex align-items-center justify-content-center min-vh-100 position-relative w-100">
        
        <div class="card shadow border-0 p-5 rounded-4 bg-white" style="max-width: 800px; width: 100%;">
            
            <h2 class="fw-bold mb-4 texto-azul-escuro">Cadastro de Usuário</h2>

            <form>
                <div class="d-flex align-items-center mb-4">
                    <label class="fw-bold me-3 texto-azul-escuro">Permissão:</label>
                    <select id="permissao" class="form-select input-personalizado" style="width: 200px;">
                        <option selected>Selecione tipo</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="fw-bold mb-2 texto-azul-escuro">Nome do novo usuário:</label>
                    <input id="nome" type="text" class="form-control input-personalizado p-2" placeholder="Nome completo">
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="fw-bold mb-2 texto-azul-escuro">CPF</label>
                        <input id="cpf" type="text" class="form-control input-personalizado p-2" placeholder="000.000.000-00">
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label class="fw-bold mb-2 texto-azul-escuro">Data de Nascimento</label>
                        <input id="dataNascimento" type="date" class="form-control input-personalizado p-2">
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-md-6">
                        <label class="fw-bold mb-2 texto-azul-escuro">E-mail</label>
                        <input id="email" type="email" class="form-control input-personalizado p-2" placeholder="email@abc.com">
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label class="fw-bold mb-2 texto-azul-escuro">Senha</label>
                        <input id="senha" type="password" class="form-control input-personalizado p-2" placeholder="123456">
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-4 mt-2">
                    <button id="btCancelar" type="button" class="btn btn-cancelar px-5 py-2 rounded-3">Cancelar</button>
                    <button id="btCadastrar" type="submit" class="btn btn-cadastrar px-5 py-2 rounded-3">Cadastrar</button>
                </div>
            </form>
        </div>

        <div class="position-absolute bottom-0 end-0 p-4">
             <img src="../assets/imagens/logo.png" alt="Logo do sistema" style="width: 60px;">
        </div>

    </main>
        

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/cadastro-usuario.js"></script>
</body>
</html>
