                    <ul class="nav flex-column ms-3 mt-2">

            <div class="mt-auto mb-5 ms-4">
                <a href="../index.html" class="btn-sair text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 600; font-size: 1rem;">Sair</span>
                </a>
            </div>

        <main class="d-flex align-items-center justify-content-center min-vh-100 position-relative w-100">
        
        <div class="card shadow border-0 p-5 rounded-4 bg-white" style="max-width: 800px; width: 100%;">
            
            <h2 class="fw-bold mb-4 texto-azul-escuro">Cadastro de Usuário</h2>

            <form>
                <div class="d-flex align-items-center mb-4">
                    <label class="fw-bold me-3 texto-azul-escuro">Permissão:</label>
                    <select id="permissao" class="form-select input-personalizado" style="width: 200px;">
                        <option selected>Selecione tipo</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="fw-bold mb-2 texto-azul-escuro">Nome do novo usuário:</label>
                    <input id="nome" type="text" class="form-control input-personalizado p-2" placeholder="Nome completo">
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="fw-bold mb-2 texto-azul-escuro">CPF</label>
                        <input id="cpf" type="text" class="form-control input-personalizado p-2" placeholder="000.000.000-00">
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label class="fw-bold mb-2 texto-azul-escuro">Data de Nascimento</label>
                        <input id="dataNascimento" type="date" class="form-control input-personalizado p-2">
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-md-6">
                        <label class="fw-bold mb-2 texto-azul-escuro">E-mail</label>
                        <input id="email" type="email" class="form-control input-personalizado p-2" placeholder="email@abc.com">
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <label class="fw-bold mb-2 texto-azul-escuro">Senha</label>
                        <input id="senha" type="password" class="form-control input-personalizado p-2" placeholder="123456">
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-4 mt-2">
                    <button id="btCancelar" type="button" class="btn btn-cancelar px-5 py-2 rounded-3">Cancelar</button>
                    <button id="btCadastrar" type="submit" class="btn btn-cadastrar px-5 py-2 rounded-3">Cadastrar</button>
                </div>
            </form>
        </div>

        <div class="position-absolute bottom-0 end-0 p-4">
             <img src="caminho-para-sua-logo.png" alt="Logo do sistema" style="width: 60px;">
        </div>

    </main>
        

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
