<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Cadastro de Equipamentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/cadastro.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">
        <!-- navbar mobile -->
        <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm"
            style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo"
                    style="width: 40px;"></a>
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i>
            </button>
        </header>
        <!-- sidebar -->
        <nav id="sidebar" class="offcanvas-lg offcanvas-start d-flex flex-column h-100 pt-lg-4" tabindex="-1"
            style="width: 250px; background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); flex-shrink: 0;">

            <div class="d-lg-none text-end p-3 pb-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                    data-bs-target="#sidebar"></button>
            </div>

            <div class="text-center mb-4 d-none d-lg-block">
                <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo"
                        style="width: 60px;"></a>
            </div>

            <div class="flex-grow-1 overflow-y-auto">
                <a href="../pages/computadores.html" class="sidebar-link">Equipamentos</a>
                <div class="collapse show" id="gavetaComputadores">
                    <a href="computadores.html" class="sidebar-sublink">Computadores</a>
                    <a href="impressoras.html" class="sidebar-sublink">Impressoras</a>
                    <a href="#" class="sidebar-sublink">Estabilizadores</a>
                </div>
                <a href="movimentacoes.html" class="sidebar-link">Movimentações</a>
                <a href="setores.html" class="sidebar-link">Setores</a>
                <div class="collapse" id="gavetaSetores">
                    <a href="subsetores.html" class="sidebar-sublink">Subsetores</a>
                </div>
                <a href="relatorios.html" class="sidebar-link">Relatórios</a>
                <a href="usuario.html" class="sidebar-link">Usuários</a>
            </div>

            <div class="mt-auto p-4 text-left">
                <a href="../index.html" id="btn-sair"
                    class="btn-sair text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 500;">Sair</span>
                </a>
            </div>
        </nav>

        <main class="flex-grow-1 position-relative p-3 p-lg-5"
            style="background-color: #E6F4FB; overflow-y: auto; overflow-x: hidden;">

            <div class="bg-white p-4 p-lg-5 rounded-4 shadow-sm mx-auto"
                style="max-width: 900px; z-index: 1; position: relative;">

                <h2 style="color: #1D4587; font-weight: bold; margin-bottom: 40px; text-align: center;">Cadastro de
                    Equipamentos</h2>

                <form>
                    <div class="row g-4 mb-4">

                        <div class="col-md-6">
                            <div class="d-flex align-items-center gap-3">
                                <label class="label-azul mb-0 fs-5">Tipo:</label>
                                <select class="form-select input-vermelho flex-grow-1"
                                    style="background-color: #ffeaea; color: #D32F2F;">
                                    <option selected>Selecione</option>
                                    <option value="1">Computador</option>
                                    <option value="2">Impressora</option>
                                    <option value="3">Estabilizador</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="d-flex align-items-center gap-3">
                                <label class="label-azul mb-0 fs-5">Setor:</label>
                                <select class="form-select input-vermelho flex-grow-1"
                                    style="background-color: #ffeaea; color: #D32F2F;">
                                    <option selected>Selecione</option>
                                    <option value="1">RH</option>
                                    <option value="2">Sala Treinamento</option>
                                    <option value="3">Recepção</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul d-block">Tombamento</label>
                            <input type="text" class="form-control input-vermelho w-100"
                                placeholder="00000.00000.000-00">
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul d-block">Sistema operacional</label>
                            <input type="text" class="form-control input-vermelho w-100" placeholder="Sistema">
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul d-block">Memória interna CPU</label>
                            <input type="text" class="form-control input-vermelho w-100" placeholder="Memória">
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul d-block">Memória RAM</label>
                            <input type="text" class="form-control input-vermelho w-100" placeholder="Memória RAM">
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul d-block">Armazenamento</label>
                            <input type="text" class="form-control input-vermelho w-100" placeholder="Armazenamento">
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul d-block">Número IP</label>
                            <input type="text" class="form-control input-vermelho w-100" placeholder="Número">
                        </div>

                        <div class="col-12 mt-4">
                            <label class="label-azul d-block">Observações</label>
                            <textarea class="form-control input-vermelho w-100" rows="4"
                                placeholder="Detalhes adicionais"></textarea>
                        </div>

                        <div class="col-12 d-flex flex-column flex-sm-row justify-content-center gap-3 mt-5 mb-4">

                            <a href="computadores.html" class="text-decoration-none d-flex">
                                <button type="button" class="btn text-white fw-bold w-100"
                                    style="background-color: #bd4a4a; min-width: 150px; border-radius: 6px;">
                                    Cancelar
                                </button>
                            </a>

                            <button type="submit" class="btn text-white fw-bold"
                                style="background-color: #214383; min-width: 150px; border-radius: 6px;">
                                Cadastrar
                            </button>

                        </div>

                    </div>
                </form>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração"
                class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block"
                style="width: 70px; z-index: 0; opacity: 0.9;">

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
