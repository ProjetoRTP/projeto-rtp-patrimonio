<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Cadastro de Equipamentos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="../assets/css/cadastro.css">
    
</head>

<body>
    <div class="d-flex vh-100">
        
        <!-- Navbar -->
        <nav id="sidebar" class="d-flex flex-column vh-100" style="width: 250px; background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%));">
            <div class="text-center mt-4 mb-4">
                <img src="../assets/imagens/logo-branca.png" alt="Logo PROCAPE" style="width: 70px;">
            </div>
            <ul class="nav flex-column w-100 px-4">
                <li class="nav-item linha-divisoria">
                    <a class="nav-link text-white fw-bold px-0" href="#">Equipamentos</a>
                    <ul class="nav flex-column ms-3 mt-2">
                        <li class="nav-item">
                            <a class="nav-link text-white px-0 py-1" style="font-size: 0.9rem;" href="lista.html">Computadores</a>
                        </li>
                        <li class="nav-item"><a class="nav-link text-white-50 px-0 py-1" style="font-size: 0.9rem;" href="#">Impressoras</a></li>
                        <li class="nav-item"><a class="nav-link text-white-50 px-0 py-1" style="font-size: 0.9rem;" href="#">Estabilizadores</a></li>
                    </ul>
                </li>
                <li class="nav-item linha-divisoria"><a class="nav-link text-white fw-bold px-0" href="#">Movimentações</a></li>
                <li class="nav-item linha-divisoria"><a class="nav-link text-white fw-bold px-0" href="#">
                    es</a></li>
                <li class="nav-item linha-divisoria"><a class="nav-link text-white fw-bold px-0" href="#">Relatórios</a></li>
                <li class="nav-item linha-divisoria"><a class="nav-link text-white fw-bold px-0" href="#">Usuários</a></li>
                <li class="nav-item linha-divisoria"><a class="nav-link text-white fw-bold px-0" href="#">Manutenção</a></li>
            </ul>
            <div class="mt-auto mb-5 ms-4">
                <a href="index.html" class="btn-sair text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 600; font-size: 1rem;">Sair</span>
                </a>
            </div>
        </nav>

        <!-- Cadastro de Equipamentos -->
        <main class="flex-grow-1 position-relative p-5 overflow-auto" style="background-color: #E6F4FB;">
            
            <div class="bg-white p-5 rounded-4 shadow-sm mx-auto" style="max-width: 900px; z-index: 1; position: relative;">
                
                <h2 style="color: #1D4587; font-weight: bold; margin-bottom: 40px;">Cadastro de Equipamentos</h2>

                <form>
                    
                    <div class="d-flex flex-wrap gap-5 mb-4">
    
                        <div class="d-flex align-items-center gap-3">
                            <label class="label-azul mb-0 fs-5">Tipo:</label>
                            <select class="form-select input-vermelho" style="width: 200px; background-color: #ffeaea; color: #D32F2F;">
                                <option selected>Selecione</option>
                                <option value="1">Computador</option>
                                <option value="2">Impressora</option>
                                <option value="3">Estabilizador</option>
                            </select>
                        </div>

                        <div class="d-flex align-items-center gap-3">
                            <label class="label-azul mb-0 fs-5">Setor:</label>
                            <select class="form-select input-vermelho" style="width: 200px; background-color: #ffeaea; color: #D32F2F;">
                                <option selected>Selecione</option>
                                <option value="1">opt1</option>
                                <option value="2">opt2</option>
                                <option value="3">opt3</option>
                            </select>
                        </div>
                        
                    </div>

                    <div class="row g-4"> <div class="col-md-6"> <label class="label-azul d-block">Tombamento</label>
                            <input type="text" class="form-control input-vermelho" placeholder="00000.00000.000-00">
                        </div>
                        <div class="col-md-6">
                            <label class="label-azul d-block">Sistema operacional</label>
                            <input type="text" class="form-control input-vermelho" placeholder="Sistema">
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul d-block">Memória interna CPU</label>
                            <input type="text" class="form-control input-vermelho" placeholder="Memória">
                        </div>
                        <div class="col-md-6">
                            <label class="label-azul d-block">Memória RAM</label>
                            <input type="text" class="form-control input-vermelho" placeholder="Memória RAM">
                        </div>

                        <div class="col-md-6">
                            <label class="label-azul d-block">Armazenamento</label>
                            <input type="text" class="form-control input-vermelho" placeholder="Armazenamento">
                        </div>
                        <div class="col-md-6">
                            <label class="label-azul d-block">Número IP</label>
                            <input type="text" class="form-control input-vermelho" placeholder="Número">
                        </div>

                        <div class="col-12 mt-4">
                            <label class="label-azul d-block">Observações</label>
                            <textarea class="form-control input-vermelho" rows="4" placeholder="Detalhes adicionais"></textarea>
                        </div>

                        <div class="d-flex justify-content-center gap-4 mt-5 mb-4">
                            <a href="equipamentos-computadores.html">
                                <button type="button" class="btn text-white fw-bold" style="background-color: #bd4a4a; width: 140px; border-radius: 6px;">
                                    Cancelar
                                </button>
                            </a>

                            <button type="submit" class="btn text-white fw-bold" style="background-color: #214383; width: 140px; border-radius: 6px;">
                                Cadastrar
                            </button>
                        </div>

                    </div>
                </form>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração" class="position-absolute bottom-0 end-0 mb-4 me-4" style="width: 70px; z-index: 0; opacity: 0.9;">
            
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
