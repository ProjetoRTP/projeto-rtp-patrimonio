<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Info Computador</title>

    <!-- Frameworks e Fontes -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Seus arquivos CSS -->
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../navbar/navbar.css?v=4">
</head>

<body style="background-color: #EAF2F8; overflow: auto; scroll-behavior: smooth;">
    <!-- min-vh-100 garante que o fundo azul cubra toda a tela, mesmo se o conteúdo crescer -->
    <div class="d-flex min-vh-100">

        <!-- Sidebar container -->
        <div id="espaco-da-navbar"></div>

        <!-- 
            MUDANÇAS CRÍTICAS:
            - Usamos align-items-start para o card começar no topo.
            - py-5 adiciona um espaçamento de segurança no topo e no fundo.
        -->
        <main class="d-flex justify-content-center align-items-start flex-grow-1 py-5 px-3" style="overflow-y: auto; max-height: 100vh;">

            <div class="card shadow border-0 p-4 p-md-5 rounded-4 bg-white" style="max-width: 950px; width: 100%; max-height: calc(100vh - 6rem); overflow-y: auto;">

                <h2 class="fw-bold mb-4" style="color: #1D4587;">Informações do Computador</h2>

                <div class="row">
                    <!-- Linha 1: Dados de Identificação -->
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Tombamento (Patrimônio):</label>
                        <input id="info-tombamento" type="text" class="form-control" disabled="">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Status Atual:</label>
                        <input id="info-status" type="text" class="form-control" disabled="">
                    </div>

                    <!-- Linha 2: Especificações Técnicas (JOIN com tabela computadores) -->
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Sistema Operacional:</label>
                        <input id="info-os" type="text" class="form-control" disabled="">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Memória RAM:</label>
                        <input id="info-ram" type="text" class="form-control" disabled="">
                    </div>

                    <!-- Linha 3 -->
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Processador (CPU):</label>
                        <input id="info-cpu" type="text" class="form-control" disabled="">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Armazenamento (HD/SSD):</label>
                        <input id="info-armazenamento" type="text" class="form-control" disabled="">
                    </div>

                    <!-- Linha 4: Rede e Localização -->
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Endereço IP:</label>
                        <input id="info-ip" type="text" class="form-control" disabled="">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Setor Principal:</label>
                        <input id="info-setor" type="text" class="form-control" disabled="">
                    </div>

                    <!-- Linha 5 -->
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Subsetor / Sala:</label>
                        <input id="info-subsetor" type="text" class="form-control" disabled="">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="fw-bold mb-1">Responsável Técnico:</label>
                        <input id="info-colaborador" type="text" class="form-control" disabled="">
                    </div>

                    <!-- Linha 6: Datas e Valores -->
                    <div class="col-md-4 mb-3">
                        <label class="fw-bold mb-1">Data de Aquisição:</label>
                        <input id="info-data-aquisicao" type="text" class="form-control" disabled="">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="fw-bold mb-1">Data de Registro no Sistema:</label>
                        <input id="info-data-cadastro" type="text" class="form-control" disabled="">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="fw-bold mb-1">Valor:</label>
                        <input id="info-valor" type="text" class="form-control" disabled="">
                    </div>

                    <!-- Linha 7: Observações Gerais -->
                    <div class="col-12 mb-3">
                        <label class="fw-bold mb-1">Observações Técnicas:</label>
                        <textarea id="info-observacao" class="form-control" rows="3" disabled="" style="resize: none;"></textarea>
                    </div>
                </div>

                <!-- Ações no final do Card -->
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button type="button" class="btn btn-secondary px-5" onclick="window.history.back()">Voltar</button>

                    <a id="btn-editar-comp" href="#" class="btn btn-primary px-5" style="background-color: #1D4587; color: white; text-decoration: none; display: flex; align-items: center; justify-content: center;">
                        Editar Dados
                    </a>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts do Sistema -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./computador-info.js"></script>
    <script src="../navbar/navbar.js"></script>


</body></html>
