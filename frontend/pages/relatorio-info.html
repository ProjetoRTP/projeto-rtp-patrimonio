<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Visualizar Relatório</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/relatorio-info.css">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="d-flex flex-column flex-lg-row vh-100">

        <header class="d-lg-none w-100 p-3 d-flex justify-content-between align-items-center shadow-sm"
            style="background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); z-index: 1040;">
            <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo"
                    style="width: 40px;"></a>
            <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#sidebar" aria-controls="sidebar">
                <i class="bi bi-list fs-1"></i>
            </button>
        </header>

        <nav id="sidebar" class="offcanvas-lg offcanvas-start d-flex flex-column h-100 pt-lg-4" tabindex="-1"
            style="width: 250px; background: var(--bg-gradiente, linear-gradient(180deg, #1D4587 0%, #022154 100%)); flex-shrink: 0;">

            <div class="d-lg-none text-end p-3 pb-0">
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                    data-bs-target="#sidebar"></button>
            </div>

            <div class="text-center mb-4 d-none d-lg-block">
                <a href="../pages/menu_principal.html"><img src="../assets/imagens/logo-branca.png" alt="Logo"
                        style="width: 60px;"></a>
            </div>

            <div class="flex-grow-1 overflow-y-auto">
                <a href="../pages/equipamentos-computadores.html" class="sidebar-link">Equipamentos</a>
                <a href="movimentacoes.html" class="sidebar-link">Movimentações</a>
                <a href="setores.html" class="sidebar-link">Setores</a>
                <a href="relatorios.html" class="sidebar-link active">Relatórios</a>
                <a href="usuario.html" class="sidebar-link">Usuários</a>
            </div>

            <div class="mt-auto p-4 text-left">
                <a href="../index.html" id="btn-sair"
                    class="text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 500;">Sair</span>
                </a>
            </div>
        </nav>

        <main class="flex-grow-1 p-3 p-lg-5 position-relative"
            style="background-color: #EAF2F8; overflow-y: auto; overflow-x: hidden;">

            <div class="bg-white rounded-4 shadow-sm w-100 p-4 p-lg-5 mx-auto" style="max-width: 1000px; z-index: 1;">

                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-5 gap-3">
                    <h2 style="color: var(--azul-principal, #1D4587); font-weight: 700; margin: 0;">Relatórios</h2>

                    <a onclick="gerarRelatorioGeral()" class="btn-cadastrar-custom w-100 w-sm-auto d-flex justify-content-center align-items-center" style="cursor: pointer;">
                        <i class="bi bi-clipboard-data me-2"></i> Relatório Geral
                    </a>
                </div>

                <h3 class="titulo-relatorio mb-4" style="color: #1D4587; font-weight: 600;">Relatório dos Equipamentos</h3>

                <div class="row align-items-center mb-5">

                    <div class="col-12 col-md-6">
                        <div class="mb-3" >
                            <strong style="color: #1D4587;">Data:</strong>
                            <span id="data" class="badge-info text-muted"></span>
                        </div>

                        <div>
                            <strong style="color: #1D4587;">Setor:</strong>
                            <span id="setor" class="badge-info text-muted"></span>
                        </div>
                    </div>

                    <div class="col-12 col-md-6 mt-4 mt-md-0">
                        <div class="box-resumo d-flex flex-wrap gap-3 justify-content-md-end">
                            <div class="text-center p-2 rounded" style="background-color: #f8f9fa; min-width: 80px;">
                                <small class="text-muted fw-bold">Total</small><br> 
                                <span id="total" class="fs-5" style="color: #1D4587; font-weight: 700;">-</span> 
                            </div>
                            <div class="text-center p-2 rounded" style="background-color: #f8f9fa; min-width: 80px;">
                                <small class="text-muted fw-bold">Em uso</small><br> 
                                <span id="uso" class="fs-5" style="color: #28a745; font-weight: 700;">-</span> 
                            </div>
                            <div class="text-center p-2 rounded" style="background-color: #f8f9fa; min-width: 80px;">
                                <small class="text-muted fw-bold">Manut.</small><br> 
                                <span id="manut" class="fs-5" style="color: #dc3545; font-weight: 700;">-</span> 
                            </div>
                            <div class="text-center p-2 rounded" style="background-color: #f8f9fa; min-width: 80px;">
                                <small class="text-muted fw-bold">Estoque</small><br>
                                <span id="estoque" class="fs-5" style="color: #ffc107; font-weight: 700;">-</span>
                            </div>
                        </div>
                    </div>

                </div>

                <h5 class="mb-4" style="color: #1D4587; font-weight: 600;">Lista de equipamentos</h5>

                <div class="table-responsive w-100 border rounded-3">
                    <table class="table tabela-padrao align-middle mb-0" style="min-width: 800px;">
                        <thead class="table-light">
                            <tr>
                                <th style="color: #D32F2F; font-size: 0.85rem;">TOMB.</th>
                                <th style="color: #D32F2F; font-size: 0.85rem;">TIPO</th>
                                <th style="color: #D32F2F; font-size: 0.85rem;">MODELO</th>
                                <th style="color: #D32F2F; font-size: 0.85rem;">PATRIMÔNIO</th>
                                <th style="color: #D32F2F; font-size: 0.85rem;">STATUS</th>
                                <th style="color: #D32F2F; font-size: 0.85rem;">ENTRADA</th>
                                <th style="color: #D32F2F; font-size: 0.85rem;">ÚLTIMA MOV.</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-equipamentos">
                            <tr>
                                <td colspan="7" class="text-center py-4 text-muted">Nenhum equipamento carregado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração"
                class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block"
                style="width: 60px; z-index: 0; opacity: 0.8;">
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/assets/js/relatorio-info.js"></script>

</body>

</html>
