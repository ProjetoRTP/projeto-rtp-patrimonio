<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Relatórios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/relatorios.css?v=3">
    <link rel="shortcut icon" href="../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body class="fundo-tela" >

    <div class="d-flex flex-column flex-lg-row vh-100">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="d-flex align-items-start justify-content-center min-vh-100 position-relative w-100 py-5">
            
            <div class="bg-white rounded-4 shadow-sm w-100 p-4 p-lg-5 mx-auto" style="max-width: 1000px; z-index: 1;">

                <!-- Cabeçalho -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-5 gap-3">
                    <h2 style="color: var(--azul-principal, #1D4587); font-weight: 700; margin: 0;">Relatório</h2>
                    <a href="relatorios.html"
                        class="btn btn-outline-danger rounded-pill px-4 py-2 d-flex align-items-center gap-2 fw-bold text-decoration-none">
                        <i class="bi bi-arrow-left me-2"></i> Voltar
                    </a>
                </div>

                <!-- Filtros aplicados -->
                <div class="row mb-4">
                    <div class="col-12 col-md-6">
                        <div class="mb-2">
                            <strong style="color: #1D4587;">Tipo:</strong>
                            <span id="info-tipo" class="text-muted ms-1">—</span>
                        </div>
                        <div class="mb-2">
                            <strong style="color: #1D4587;">Período:</strong>
                            <span id="data" class="text-muted ms-1">—</span>
                        </div>
                        <div>
                            <strong style="color: #1D4587;">Setor:</strong>
                            <span id="setor" class="text-muted ms-1">Todos</span>
                        </div>
                    </div>

                    <!-- Cards de resumo -->
                    <div class="col-12 col-md-6 mt-4 mt-md-0">
                        <div class="d-flex flex-wrap gap-3 justify-content-md-end">
                            <div class="text-center p-2 rounded" style="background-color: #f8f9fa; min-width: 80px;">
                                <small class="text-muted fw-bold">Total</small><br>
                                <span id="total" class="fs-5" style="color: #1D4587; font-weight: 700;">-</span>
                            </div>
                            <div class="text-center p-2 rounded" style="background-color: #f8f9fa; min-width: 80px;">
                                <small class="text-muted fw-bold">Movim.</small><br>
                                <span id="uso" class="fs-5" style="color: #28a745; font-weight: 700;">-</span>
                            </div>
                            <div class="text-center p-2 rounded" style="background-color: #f8f9fa; min-width: 80px;">
                                <small class="text-muted fw-bold">Manut.</small><br>
                                <span id="manut" class="fs-5" style="color: #dc3545; font-weight: 700;">-</span>
                            </div>
                            <div class="text-center p-2 rounded" style="background-color: #f8f9fa; min-width: 80px;">
                                <small class="text-muted fw-bold">Cadastros</small><br>
                                <span id="estoque" class="fs-5" style="color: #ffc107; font-weight: 700;">-</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Tabela -->
                <h5 class="mb-3" style="color: #1D4587; font-weight: 600;">Registros</h5>

                <div class="table-responsive w-100">
                    <table class="table tabela-padrao mb-0" style="min-width: 700px;">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>TIPO</th>
                                <th>EQUIPAMENTO</th>
                                <th>USUÁRIO</th>
                                <th>DATA</th>
                                <th>DESCRIÇÃO</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-equipamentos">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">A carregar...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração"
                class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block"
                style="width: 60px; z-index: 0; opacity: 0.8;">

        </main>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/relatorio-info.js?v=2"></script>
    <script src="../assets/js/navbar.js"></script>

</body>

</html>
