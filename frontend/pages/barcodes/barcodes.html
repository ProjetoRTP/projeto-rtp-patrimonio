<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Código de Barras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../navbar/navbar.css?v=4">
    <link rel="stylesheet" href="./barcodes.css">
    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body style="overflow: auto; scroll-behavior: smooth;">
    <div class="page-wrapper" >

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <main class="flex-grow-1 position-relative p-3 p-lg-5" style="background-color: #E6F4FB; overflow-y: auto; overflow-x: hidden;">

            <div class="bg-white p-4 p-lg-5 rounded-4 shadow-sm mx-auto" style="max-width: 980px; z-index: 1; position: relative;">

                <!-- Cabeçalho -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
                    <h2 style="color: #1D4587; font-weight: bold; margin: 0;">Código de Barras</h2>
                </div>

                <!-- Layout: tabela + barcode lado a lado -->
                <div class="bc-layout">

                    <!-- Coluna esquerda: tabela -->
                    <div class="bc-col-tabela">
                        <div class="table-responsive w-100">
                            <table class="table table-borderless align-middle" style="min-width: 500px;">
                                <thead>
                                    <tr style="border-bottom: 2px solid #f1f1f1;">
                                        <th scope="col" style="width: 40px;" class="pb-3"></th>
                                        <th scope="col" style="color: #D32F2F; font-size: 0.85rem; font-weight: bold; text-align: center;" class="pb-3">CÓDIGO</th>
                                        <th scope="col" style="color: #D32F2F; font-size: 0.85rem; font-weight: bold; text-align: center;" class="pb-3">PATRIMÔNIO</th>
                                        <th scope="col" style="color: #D32F2F; font-size: 0.85rem; font-weight: bold; text-align: center;" class="pb-3">TIPO</th>
                                        <th scope="col" style="color: #D32F2F; font-size: 0.85rem; font-weight: bold; text-align: center;" class="pb-3">SETOR</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-equipamentos">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted py-4">Carregando...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Paginação -->
                        <div id="paginacao" class="bc-paginacao"></div>
                    </div>

                    <!-- Coluna direita: barcode -->
                    <div class="bc-col-barcode">
                        <p class="bc-label-barcode">CÓDIGO DE BARRAS</p>

                        <div id="barcode-area" class="bc-barcode-box">
                            <span class="text-muted" style="font-size:0.82rem;">Selecione um item</span>
                        </div>

                        <button id="btn-imprimir" class="btn btn-outline-danger rounded-pill px-4 py-2 fw-bold w-100" style="display:none; font-size:0.85rem; letter-spacing:0.04em;">
                            <i class="bi bi-printer me-2"></i> IMPRIMIR
                        </button>
                    </div>

                </div>

            </div>

            <img src="../../assets/imagens/logo.png" alt="Logo" class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block" style="width: 70px; z-index: 0; opacity: 0.9;">
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../navbar/navbar.js"></script>
    <script src="./barcodes.js"></script>
</body>
</html>
