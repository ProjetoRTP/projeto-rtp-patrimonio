<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Código de Barras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../navbar/navbar.css">
    <link rel="stylesheet" href="./barcodes.css">
    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body style="background-color:#E6F4FB; min-height:100vh;">
    <div id="espaco-da-navbar"></div>

    <main style="padding: 32px 40px;">

        <div class="card-bc">

            <!-- Título -->
            <h2 class="bc-titulo">Código de Barras</h2>

            <!-- Layout: tabela + barcode side by side -->
            <div class="bc-layout">

                <!-- ── Coluna esquerda: tabela ── -->
                <div class="bc-col-tabela">
                    <table class="bc-table">
                        <thead>
                            <tr>
                                <th style="width: 100px; text-align: center;">
                                    <input type="checkbox" id="check-todos" title="Selecionar todos" style="margin-right: 5px;">
                                    <span>TODOS</span>
                                </th>
                                <th>CÓDIGO</th>
                                <th>PATRIMÔNIO</th>
                                <th>TIPO</th>
                                <th>SETOR</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-equipamentos">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">Carregando...</td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Paginação -->
                    <div id="paginacao" class="bc-paginacao"></div>
                </div>

                <!-- ── Coluna direita: barcode ── -->
                <div class="bc-col-barcode">
                    <p class="bc-label-barcode">CÓDIGO DE BARRAS</p>

                    <div id="barcode-area" class="bc-barcode-box">
                        <span class="text-muted" style="font-size:0.82rem;">Selecione um item</span>
                    </div>

                    <button id="btn-imprimir" class="bc-btn-imprimir" style="display:none;">
                        IMPRIMIR
                    </button>
                </div>

            </div>
        </div>

        <img src="../../assets/imagens/logo.png" alt="Logo" class="position-fixed bottom-0 end-0 mb-4 me-4 d-none d-lg-block" style="width:60px; opacity:0.8; z-index:0;">
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../navbar/navbar.js"></script>
    <script src="./barcodes.js"></script>
</body></html>
