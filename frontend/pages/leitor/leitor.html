<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Leitor de Código de Barras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Design System CSS -->
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/navbar.css">
    <link rel="stylesheet" href="../../assets/css/botoes.css">
    <link rel="stylesheet" href="../../assets/css/inputs.css">
    <link rel="stylesheet" href="../../assets/css/card-detalhe.css">
    <link rel="stylesheet" href="./leitor.css">

    <!-- navbar CSS -->
    <link rel="stylesheet" href="../navbar/navbar.css">

    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body style="margin: 0;">
    <div class="page-wrapper">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <!-- Conteúdo -->
        <div class="page-content flex-grow-1 position-relative p-3 p-lg-5"
            style="background-color: #E6F4FB; overflow-y: auto; overflow-x: hidden;">
            <div class="card-principal p-4 p-lg-5 rounded-4 shadow-sm mx-auto" style="max-width: 900px;">

                <h2>Leitor de Código de Barras</h2>

                <div class="layout-leitor">

                    <!-- ── Coluna esquerda ── -->
                    <div class="col-leitor">

                        <!-- Conectar scanner -->
                        <div class="leitor-grupo">
                            <label class="leitor-label">Digite ou conecte o scanner</label>
                            <div class="d-flex gap-3 align-items-center">
                                <input type="text" class="input-vermelho" id="input-scanner"
                                    placeholder="Receber Código" style="color: #495057; max-width: 260px;">
                                <button type="button" class="btn-perigo" id="btn-buscar" disabled="">
                                    BUSCAR PRODUTO
                                </button>
                            </div>
                        </div>
                    </div>
                    <hr class="leitor-divisoria">
                    <!-- ── Coluna direita: detalhes + código de barras ── -->
                    <div class="resultado-container">
                        <div class="detalhes-item">
                            <p class="titulo-secao">DETALHES DO ITEM</p>
                            <div class="detalhe-info" id="detalhe-item">
                                <span style="color:#adb5bd; font-size:0.85rem;">
                                    Nenhum produto buscado ainda.
                                </span>
                            </div>
                        </div>
                        <hr class="detalhe-divisoria">
                        <div class="codigo-barras">
                            <p class="titulo-secao">CÓDIGO DE BARRAS</p>
                            <div id="barcode-area" class="barcode-container"></div>
                        </div>
                        <hr class="detalhe-divisoria">
                        <div class="">
                            <div class=" mt-3" style="text-align: left !important;">
                                <button class="btn-primario" id="btn-imprimir" disabled>
                                    IMPRIMIR<i class="bi bi-printer icone-botao ms-2"></i>
                                </button>
                            </div>
                            <div class=" mt-3">
                                <button class="btn-primario" id="btn-telegram" title="Enviar para o Telegram" disabled>
                                    ENVIAR<img src="../../assets/imagens/icon-telegram.svg" alt="Telegram" class="icone-botao ms-1">
                                </button>
                                <div class="alert-procape alert-procape-success mt-2 d-none" id="alerta-telegram" role="alert">
                                    <i class="bi bi-check-circle-fill" id="alerta-telegram-icone"></i>
                                    <span id="alerta-telegram-texto">Enviado ao Telegram com sucesso!</span>
                                    <button type="button" class="alerta-procape-close" id="btn-fechar-alerta" aria-label="Fechar">&times;</button>
                                </div>
                            </div>
                        </div>
                </div>
                
            </div>

        </div>  
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../navbar/navbar.js"></script>
    <script src="./leitor.js"></script>


</body>

</html>
