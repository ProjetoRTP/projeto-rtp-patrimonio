<!DOCTYPE html><html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Leitor de Código de Barras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Design System CSS -->
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/navbar.css">
    <link rel="stylesheet" href="../../assets/css/botoes.css">
    <link rel="stylesheet" href="../../assets/css/inputs.css">
    <link rel="stylesheet" href="../../assets/css/card-detalhe.css">
    <link rel="stylesheet" href="./leitor.css">

    <!-- navbar CSS -->
    <link rel="stylesheet" href="../navbar/navbar.css">

    <link rel="shortcut icon" href="../../assets/imagens/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="page-wrapper">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <!-- Conteúdo -->
        <div class="page-content" style="background-color: #E6F4FB; overflow-y: auto; overflow-x: hidden;">
            <div class="card-principal">

                <h2>Leitor de Código de Barras</h2>

                <div class="layout-leitor">

                    <!-- ── Coluna esquerda ── -->
                    <div class="col-leitor">

                        <!-- Conectar scanner -->
                        <div class="leitor-grupo">
                            <label class="leitor-label">Conecte o scanner</label>
                            <div class="d-flex gap-3 align-items-center">
                                <input type="text" class="input-vermelho" id="input-scanner" placeholder="Receber Código" style="max-width: 260px;">
                                <button class="btn-perigo" id="btn-buscar" disabled="">
                                    BUSCAR PRODUTO
                                </button>
                            </div>
                        </div>

                    </div>

                    <!-- ── Coluna direita: detalhes + código de barras ── -->
                    <div class="col-detalhe">

                        <p class="titulo-secao">DETALHES DO ITEM</p>
                        <div class="detalhe-info" id="detalhe-item">
                            <span style="color:#adb5bd; font-size:0.85rem;">
                                Nenhum produto buscado ainda.
                            </span>
                        </div>

                        <hr class="detalhe-divisoria">

                        <p class="titulo-secao">CÓDIGO DE BARRAS</p>
                        <div id="barcode-area" class="barcode-container"></div>

                        <div class="text-center mt-2">
                            <button class="btn-primario" id="btn-imprimir" style="display:none;">
                                IMPRIMIR
                            </button> 
                        </div>

                    </div>
                </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../navbar/navbar.js"></script>
    <script src="./leitor.js"></script>


</body></html>
