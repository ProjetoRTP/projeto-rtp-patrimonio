<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Template Base</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    
    <header class="d-lg-none d-flex justify-content-between align-items-center p-3 shadow-sm text-white" style="background: #022154; z-index: 1050;">
        <img src="../assets/imagens/logo-branca.png" alt="Logo PROCAPE" style="width: 40px;">
        
        <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">
            <i class="bi bi-list fs-1"></i>
        </button>
    </header>


    <div class="d-flex flex-column flex-lg-row vh-100">
        
        <nav class="offcanvas-lg offcanvas-start sidebar-master text-white d-flex flex-column" tabindex="-1" id="menuLateral">
            
            <div class="offcanvas-header d-lg-none border-bottom border-light border-opacity-10">
                <h5 class="offcanvas-title fw-bold">Menu Principal</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>

            <div class="text-center py-4 d-none d-lg-block">
                <img src="../assets/imagens/logo-branca.png" alt="Logo" style="width: 60px;">
            </div>

            <div class="flex-grow-1 overflow-y-auto mt-2">
                <a href="equipamentos.html" class="sidebar-link">Equipamentos</a>
                <a href="movimentacoes.html" class="sidebar-link">Movimentações</a>
                <a href="setores.html" class="sidebar-link active">Setores</a>
                <a href="subsetores.html" class="sidebar-sublink">Subsetores</a>
                <a href="relatorios.html" class="sidebar-link">Relatórios</a>
                <a href="usuarios.html" class="sidebar-link">Usuários</a>
            </div>

            <div class="p-4 mt-auto">
                <a href="#" id="btn-sair" class="text-white text-decoration-none d-flex align-items-center gap-2">
                    <i class="bi bi-box-arrow-left fs-5"></i>
                    <span style="font-weight: 500;">Sair</span>
                </a>
            </div>
        </nav>


        <main class="flex-grow-1 position-relative w-100" style="height: 100vh; overflow-y: auto;">
            
            <div class="p-3 p-md-4 p-lg-5 d-flex justify-content-center">
                
                <div class="bg-white rounded-4 shadow-sm w-100 p-3 p-md-4 p-lg-5" style="max-width: 900px; z-index: 1;">
                    
                    <h2>A sua tela entra aqui!</h2>
                    
                </div>

            </div>

            <img src="../assets/imagens/logo.png" alt="Logo Coração" class="position-absolute bottom-0 end-0 mb-4 me-4 d-none d-lg-block" style="width: 60px; z-index: 0; opacity: 0.8;">

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
