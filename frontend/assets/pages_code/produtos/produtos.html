<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Produtos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Design System CSS -->
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../navbar/navbar.css">
<link rel="stylesheet" href="../../css/botoes.css">
<link rel="stylesheet" href="../../css/inputs.css">
<link rel="stylesheet" href="../../css/filtros.css">
<link rel="stylesheet" href="../../css/tabela.css">
<link rel="stylesheet" href="../../css/card-detalhe.css">
<link rel="stylesheet" href="../../css/paginacao.css">
<link rel="stylesheet" href="produtos.css">

<!-- navbar CSS -->
<link rel="stylesheet" href="../navbar/navbar.css">



<link rel="shortcut icon" href="../../imagens/favicon.ico" type="image/x-icon">


</head>

<body>
    <div class="page-wrapper">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <!-- Conteúdo -->
        <div class="page-content" style="background-color: #E6F4FB; overflow-y: auto; overflow-x: hidden;">
            <div class="card-principal">

                <h2>Produtos</h2>

                <div class="layout-produtos">

                    <!-- ── Coluna esquerda: filtros + tabela + paginação ── -->
                    <div class="col-tabela">

                        <!-- Tabela -->
                        <div class="table-responsive">
                            <table class="tabela-padrao" style="min-width: 480px;">
                                <thead>
                                    <tr>
                                        <th class="col-check" style="width: 100px; text-align: left;">
                                            <div style="display: flex; align-items: center; gap: 8px;">
                                                <input type="checkbox" id="check-todos">
                                                <span>TODOS</span>
                                            </div>
                                        </th>
                                        <th>CÓDIGO</th>
                                        <th>PRODUTO</th>
                                        <th>ESTOQUE</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-produtos">

                                </tbody>
                            </table>
                        </div>

                        <!-- Paginação -->
                        <div class="paginacao" id="paginacao-container"></div>

                    </div>

                    <!-- ── Coluna direita: detalhes + código de barras ── -->
                    <div class="col-detalhe">

                        <!-- Código de Barras -->
                        <p class="titulo-secao">CÓDIGO DE BARRAS</p>
                        <div id="barcode-area" class="barcode-container"></div>

                        <div class="text-center mt-2">
                            <button class="btn-primario" id="btn-imprimir" style="display:none;">
                                IMPRIMIR
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../navbar/navbar.js"></script>
    <script src="produtos.js"></script>
</body>

</html>
