<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROCAPE - Leitor de Código de Barras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Design System CSS -->
    <link rel="stylesheet" href="../../css/global.css">
    <link rel="stylesheet" href="../../css/navbar.css">
    <link rel="stylesheet" href="../../css/botoes.css">
    <link rel="stylesheet" href="../../css/inputs.css">
    <link rel="stylesheet" href="../../css/card-detalhe.css">
    <link rel="stylesheet" href="leitor.css">

    <!-- navbar CSS -->
    <link rel="stylesheet" href="../navbar/navbar.css">

    <link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="page-wrapper">

        <!-- Navbar -->
        <div id="espaco-da-navbar"></div>

        <!-- Conteúdo -->
        <div class="page-content">
            <div class="card-principal">

                <h2>Leitor de Código de Barras</h2>

                <div class="layout-leitor">

                    <!-- ── Coluna esquerda: formulário do leitor ── -->
                    <div class="col-leitor">

                        <!-- Método -->
                        <div class="leitor-grupo">
                            <label class="leitor-label">Método</label>
                            <select class="select-vermelho" id="select-metodo" style="max-width: 260px;">
                                <option value="">Selecione...</option>
                                <option value="imagem">Carregar imagem</option>
                                <option value="scanner">Conectar scanner</option>
                            </select>
                        </div>

                        <hr class="leitor-divisoria" id="hr-metodo" style="display:none;">

                        <!-- Carregar imagem -->
                        <div class="leitor-grupo" id="grupo-imagem" style="display:none;">
                            <label class="leitor-label">Carregue uma imagem</label>
                            <label class="input-upload" for="input-imagem">
                                <span id="nome-arquivo">Procurar arquivo</span>
                                <i class="bi bi-upload"></i>
                                <input type="file" id="input-imagem" accept="image/*" hidden>
                            </label>
                        </div>

                        <!-- Conectar scanner -->
                        <div class="leitor-grupo" id="grupo-scanner" style="display:none;">
                            <label class="leitor-label">Conecte o scanner</label>
                            <div class="d-flex gap-3 align-items-center">
                                <input type="text" class="input-vermelho" id="input-scanner"
                                    placeholder="Receber Código" style="max-width: 260px;">
                                <button class="btn-perigo" id="btn-buscar">BUSCAR PRODUTO</button>
                            </div>
                        </div>

                    </div>

                    <!-- ── Coluna direita: detalhes + código de barras ── -->
                    <div class="col-detalhe">

                        <!-- Detalhes do Item -->
                        <p class="titulo-secao">DETALHES DO ITEM</p>
                        <div class="detalhe-info" id="detalhe-item">
                            Código: 001<br>
                            Produto: Dipirona 500g<br>
                            Descrição: Analgésico<br>
                            Status: Ativo
                        </div>

                        <hr class="detalhe-divisoria">

                        <!-- Código de Barras -->
                        <p class="titulo-secao">CÓDIGO DE BARRAS</p>
                        <div class="barcode-container">
                            <svg width="160" height="60" viewBox="0 0 160 60">
                                <g fill="#1D4587">
                                    <rect x="4"  width="2" height="60"/><rect x="8"  width="1" height="60"/>
                                    <rect x="11" width="3" height="60"/><rect x="16" width="1" height="60"/>
                                    <rect x="19" width="2" height="60"/><rect x="23" width="1" height="60"/>
                                    <rect x="26" width="3" height="60"/><rect x="31" width="1" height="60"/>
                                    <rect x="34" width="2" height="60"/><rect x="38" width="2" height="60"/>
                                    <rect x="42" width="1" height="60"/><rect x="45" width="3" height="60"/>
                                    <rect x="50" width="1" height="60"/><rect x="53" width="2" height="60"/>
                                    <rect x="57" width="1" height="60"/><rect x="60" width="3" height="60"/>
                                    <rect x="65" width="1" height="60"/><rect x="68" width="2" height="60"/>
                                    <rect x="72" width="2" height="60"/><rect x="76" width="1" height="60"/>
                                    <rect x="79" width="3" height="60"/><rect x="84" width="1" height="60"/>
                                    <rect x="87" width="2" height="60"/><rect x="91" width="1" height="60"/>
                                    <rect x="94" width="3" height="60"/><rect x="99" width="1" height="60"/>
                                    <rect x="102" width="2" height="60"/><rect x="106" width="2" height="60"/>
                                    <rect x="110" width="1" height="60"/><rect x="113" width="3" height="60"/>
                                    <rect x="118" width="1" height="60"/><rect x="121" width="2" height="60"/>
                                    <rect x="125" width="1" height="60"/><rect x="128" width="3" height="60"/>
                                    <rect x="133" width="1" height="60"/><rect x="136" width="2" height="60"/>
                                    <rect x="140" width="2" height="60"/><rect x="144" width="1" height="60"/>
                                    <rect x="147" width="3" height="60"/><rect x="152" width="2" height="60"/>
                                </g>
                            </svg>
                        </div>

                        <div class="text-center mt-2">
                            <button class="btn-primario" id="btn-imprimir">
                                IMPRIMIR
                            </button>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../navbar/navbar.js"></script>
    <script src="leitor.js"></script>
</body>

</html>
